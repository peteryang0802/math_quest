<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相等关系实验室 · 看得见的方程</title>
<style>
:root{
  --blue:#3B82F6; --blue-bg:#EAF1FF; --orange:#F59E0B; --orange-bg:#FEF3E2;
  --teal:#14B8A6; --purple:#8B5CF6; --pink:#EC4899; --amber:#F59E0B;
  --green:#10B981; --green-bg:#E7F9F0; --ink:#1E293B; --sub:#64748B; --line:#E5EAF1;
  --card:#FFFFFF; --bg1:#F5F8FE; --bg2:#E9F0FA;
  --shadow:0 8px 26px rgba(30,41,59,.09); --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:0 0 auto;z-index:5}
.btn{border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;border-radius:12px;
  padding:9px 14px;background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(30,41,59,.1);transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--blue);color:#fff}
.crumb{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 首页 */
#view-home{align-items:center;justify-content:center;text-align:center;padding:22px;overflow:auto}
.hero-badge{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-bg);
  padding:6px 14px;border-radius:999px;margin-bottom:12px}
.hero h1{font-size:clamp(26px,5vw,44px);margin:6px 0 10px}
.hero .lead{color:var(--sub);font-size:clamp(14px,2.2vw,16px);line-height:1.7;max-width:560px;margin:0 auto 24px}
.zone-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:min(880px,100%)}
.zone-card{flex:1 1 280px;max-width:380px;background:var(--card);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .15s;position:relative;overflow:hidden}
.zone-card:active{transform:translateY(3px)}
.zone-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.zone-card.basic::before{background:var(--blue)}
.zone-card.adv::before{background:var(--purple)}
.zone-tag{font-size:12px;font-weight:700;letter-spacing:1px}
.zone-card.basic .zone-tag{color:var(--blue)}
.zone-card.adv .zone-tag{color:var(--purple)}
.zone-card h3{margin:6px 0 8px;font-size:20px}
.zone-card p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:0 0 12px}
.zone-meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#F1F5F9;color:var(--sub)}

/* 地图 */
#view-map{overflow-y:auto}
.map-wrap{width:min(900px,100%);margin:0 auto;padding:6px 16px 28px}
.level-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.level-head{display:flex;align-items:center;gap:12px;padding:15px 18px;color:#fff}
.level-head .num{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.level-head h2{margin:0;font-size:17px}
.level-head .sub{font-size:12.5px;opacity:.85;font-weight:400}
.prob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px}
.prob-tile{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff;transition:.15s;text-align:left}
.prob-tile:active{transform:scale(.97)}
.prob-tile .idx{font-size:11px;font-weight:700;color:var(--sub)}
.prob-tile .nm{font-size:14px;font-weight:700;margin-top:3px;line-height:1.4}
.prob-tile.done .nm::after{content:" ✓";color:var(--green)}

/* 题目页 */
#view-problem{overflow:hidden}
.prob-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.board{flex:1;min-height:280px;background:rgba(255,255,255,.55);margin:0 16px;border-radius:var(--radius);
  border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.board-title{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:0}
/* 控制条 */
.controls{flex:0 0 auto;padding:14px 16px 6px}
.ctrl-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.slider-row{display:flex;align-items:center;gap:14px}
input[type=range]{flex:1;-webkit-appearance:none;height:10px;border-radius:999px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:var(--blue);box-shadow:0 2px 8px rgba(59,130,246,.5);cursor:pointer;border:3px solid #fff}
.range-val{font-weight:800;font-size:20px;min-width:54px;text-align:center;color:var(--blue)}
.var-label{font-size:12px;color:var(--sub);margin-top:8px}
.play-row{display:flex;gap:10px;align-items:center}
.play-row .btn{flex:0 0 auto}
.play-progress{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.play-progress i{display:block;height:100%;width:0;background:var(--teal);border-radius:999px;transition:width .3s}
/* 相等面板 */
.eq-panel{flex:0 0 auto;padding:8px 16px 18px}
.eq-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.eq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:clamp(14px,2.4vw,17px)}
.eq-side{padding:9px 13px;border-radius:12px;font-weight:700;color:#fff;line-height:1.4;transition:.25s}
.eq-l{background:var(--blue)}
.eq-r{background:var(--orange)}
.eq-op{font-weight:800;font-size:20px}
.eq.balanced .eq-side{box-shadow:0 0 0 3px var(--green-bg)}
.flag{margin-top:10px;font-weight:700;color:var(--green);font-size:14px;display:none;align-items:center;gap:6px}
.flag.show{display:flex}
.talk{margin-top:10px;font-size:13.5px;line-height:1.7;color:var(--ink)}
.talk b{color:var(--blue)}
.stem-text{font-size:13.5px;line-height:1.7;color:var(--sub);margin-bottom:10px}

/* 场景内通用 */
.col{flex:1;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.col.l{border-top:4px solid var(--blue)}
.col.r{border-top:4px solid var(--orange)}
.col h5{margin:0 0 6px;font-size:13.5px}
.col.l h5{color:var(--blue)} .col.r h5{color:var(--orange)}
.big-num{font-size:30px;font-weight:800;line-height:1.1}
.col.l .big-num{color:var(--blue)} .col.r .big-num{color:var(--orange)}
.unit{font-size:13px;color:var(--sub);font-weight:600}
.items{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;min-height:30px}
.items svg{width:22px;height:22px}
.ghost-item{opacity:.28}
.eq-center{font-size:34px;font-weight:800;color:var(--line);transition:.25s}
.eq-center.on{color:var(--green)}
/* ===== 播放场景通用 ===== */
.play-wrap{width:100%;display:flex;flex-direction:column;gap:14px}
.speed-card{background:#F1F5F9;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink);text-align:center;line-height:1.6}
.note-line{font-size:14px;font-weight:700;color:var(--ink);text-align:center;min-height:22px}
.note-line span{color:var(--blue)}
/* 水平分段条 */
.bar-track{display:flex;width:100%;height:54px;border-radius:12px;overflow:hidden;background:#EEF2F7;border:1px solid var(--line)}
.bar-seg{display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;
  transition:width .6s cubic-bezier(.22,1,.36,1);position:relative}
.bar-seg .seg-tag{position:absolute;bottom:-22px;font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap}
.bar-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:26px}
/* 60格水槽 */
.tank{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;width:100%;max-width:640px}
.tank .cell{aspect-ratio:1;border-radius:3px;background:#EDF1F6;border:1px solid #E2E8F0}
.tank .cell.a{background:var(--blue);border-color:var(--blue)}
.tank .cell.b{background:var(--orange);border-color:var(--orange)}
.tank-legend{display:flex;gap:18px;font-size:12.5px;color:var(--sub);font-weight:600}
.dot-legend{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 跑道 */
.runway{width:100%;position:relative;height:150px;background:repeating-linear-gradient(90deg,#F4F7FB 0 38px,#E8EEF6 38px 40px);
  border-radius:12px;border:1px solid var(--line);overflow:hidden}
.runner{position:absolute;top:0;transition:left .5s linear;display:flex;flex-direction:column;align-items:center;gap:2px}
.runner .rname{font-size:11px;font-weight:700}
.horse{font-size:30px;line-height:1}
/* 小人排列 */
.people{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.person{display:flex;flex-direction:column;align-items:center;gap:2px;width:42px}
.person svg{width:30px;height:30px}
.person .ptag{font-size:10px;font-weight:700;color:var(--sub)}
/* 利润柱 */
.cols{display:flex;gap:30px;align-items:flex-end;justify-content:center;height:230px;width:100%}
.profit{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.profit .pcol{width:80px;border-radius:12px 12px 6px 6px;display:flex;justify-content:center;align-items:flex-start;
  color:#fff;font-weight:800;font-size:14px;padding-top:8px;transition:height .8s cubic-bezier(.22,1,.36,1);min-height:0}
.profit .plabel{font-size:12.5px;font-weight:700;color:var(--sub);text-align:center;line-height:1.4}
/* 时间轴 */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.day{background:#F1F5F9;border-radius:10px;padding:10px 8px;min-height:84px;font-size:11.5px;color:var(--sub);line-height:1.5}
.day b{display:block;font-size:12px;color:var(--ink);margin-bottom:4px}
.day .task{background:#fff;border-radius:7px;padding:5px 7px;margin-top:5px;font-weight:700;font-size:11px}
@media (max-width:680px){
  .stage{flex-direction:column;gap:10px}
  .col{max-width:none;width:100%}
  .eq-center{transform:rotate(90deg);margin:-6px 0}
  .profit .pcol{width:60px}
  .cols{gap:16px}
}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="view-home">
    <div class="hero">
      <span class="hero-badge">相等关系实验室</span>
      <h1>把"相等"做给你看</h1>
      <p class="lead">方程不是背出来的，是把"相等的那一刻"记下来。拖一拖滑块、点一下播放，看着两堆东西变得一样多，方程自己就出现了。</p>
      <div class="zone-row">
        <div class="zone-card basic" data-zone="basic">
          <div class="zone-tag">第一块 · 先玩这里</div>
          <h3>基础平衡室</h3>
          <p>最常见的两种相等：总数不变、凑成总量。先把"相等"的直觉建立起来。</p>
          <div class="zone-meta"><span class="pill">2 关</span><span class="pill">8 道题</span></div>
        </div>
        <div class="zone-card adv" data-zone="adv">
          <div class="zone-tag">第二块 · 基础玩透再来</div>
          <h3>进阶平衡室</h3>
          <p>追上就相等、按比例配对、两本账比一比。更绕，也更有意思。</p>
          <div class="zone-meta"><span class="pill">3 关</span><span class="pill">3 道题</span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-map">
    <div class="topbar"><button class="btn" id="map-back">← 返回</button><div class="crumb" id="map-title"></div></div>
    <div class="map-wrap" id="map-wrap"></div>
  </section>

  <section class="view" id="view-problem">
    <div class="topbar"><button class="btn" id="prob-back">← 地图</button><div class="crumb" id="prob-title"></div></div>
    <div class="prob-wrap">
      <div class="board">
        <div class="board-title"><span id="board-name"></span><span id="board-hint" style="color:var(--green);font-weight:700"></span></div>
        <div class="stage" id="stage"></div>
      </div>
      <div class="controls"><div class="ctrl-card" id="ctrl-card"></div></div>
      <div class="eq-panel"><div class="eq-card">
        <div class="eq" id="eq"></div>
        <div class="flag" id="flag">✓ 两边相等！这一刻的数，就是方程的解</div>
        <div class="talk" id="talk"></div>
      </div></div>
    </div>
  </section>
</div>

<script>
/* ============ 数据：关卡与题目 ============ */
const LEVELS=[
  {id:'L1',zone:'basic',color:'#3B82F6',name:'总数不变',sub:'同一个量，两种算法，划等号',problems:['tree','save','parts','bus','box']},
  {id:'L2',zone:'basic',color:'#14B8A6',name:'凑成总量',sub:'几部分加起来，正好等于整体',problems:['tunnel','work','cart']},
  {id:'L3',zone:'adv',color:'#8B5CF6',name:'追上就相等',sub:'追上那一刻，两条路程一样长',problems:['chase']},
  {id:'L4',zone:'adv',color:'#EC4899',name:'按比例配对',sub:'甲÷4 = 乙÷3，配完不浪费',problems:['match']},
  {id:'L5',zone:'adv',color:'#F59E0B',name:'两本账比一比',sub:'约束下算两笔账，再比大小',problems:['milk']}
];
const ZONE_TITLE={basic:'第一块 · 基础平衡室',adv:'第二块 · 进阶平衡室'};

/* ============ SVG 小图标 ============ */
const ICON={
  tree:c=>`<svg viewBox="0 0 24 24"><rect x="10.5" y="14" width="3" height="7" fill="#92623a"/><circle cx="12" cy="10" r="8" fill="${c}"/></svg>`,
  coin:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="${c}"/><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.6"/></svg>`,
  box:c=>`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2" fill="${c}"/><path d="M3 9h18" stroke="#fff" stroke-width="1.5"/></svg>`,
  person:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="${c}"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6z" fill="${c}"/></svg>`,
  gear:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="${c}"/><g fill="${c}"><rect x="11" y="1" width="2" height="4"/><rect x="11" y="19" width="2" height="4"/><rect x="1" y="11" width="4" height="2"/><rect x="19" y="11" width="4" height="2"/></g></svg>`
};

/* ============ 视图切换 ============ */
const $=s=>document.querySelector(s);
const views={home:$('#view-home'),map:$('#view-map'),problem:$('#view-problem')};
let curZone=null,curProb=null,sceneApi=null;
const done=new Set();
function show(v){Object.values(views).forEach(x=>x.classList.remove('active'));views[v].classList.add('active');}
function navigate(h){ if(location.hash===h) applyHash(); else location.hash=h; }
function applyHash(){
  const parts=location.hash.replace('#','').split('/').filter(Boolean);
  const view=parts[0]||'home';
  if(view==='home'){show('home');}
  else if(view==='map'){curZone=parts[1]||'basic';renderMap();show('map');}
  else if(view==='problem'){const pid=parts[1];if(P[pid])openProblem(pid);}
}
window.addEventListener('hashchange',applyHash);

document.querySelectorAll('.zone-card').forEach(c=>c.onclick=()=>navigate('/map/'+c.dataset.zone));

function renderMap(){
  $('#map-title').textContent=ZONE_TITLE[curZone];
  $('#map-wrap').innerHTML='';
  LEVELS.filter(l=>l.zone===curZone).forEach(l=>{
    const b=document.createElement('div');b.className='level-block';
    const h=document.createElement('div');h.className='level-head';
    h.style.background=`linear-gradient(120deg,${l.color},${l.color}cc)`;
    h.innerHTML=`<div class="num">${l.id[1]}</div><div><h2>${l.name}</h2><div class="sub">${l.sub}</div></div>`;
    const g=document.createElement('div');g.className='prob-grid';
    l.problems.forEach((pid,i)=>{
      const t=document.createElement('div');t.className='prob-tile'+(done.has(pid)?' done':'');
      t.innerHTML=`<div class="idx">${l.id}-${i+1}</div><div class="nm">${P[pid].name}</div>`;
      t.onclick=()=>navigate('/problem/'+pid);g.appendChild(t);
    });
    b.append(h,g);$('#map-wrap').appendChild(b);
  });
}
$('#map-back').onclick=()=>navigate('/home');
$('#prob-back').onclick=()=>navigate('/map/'+curZone);

/* ============ 题目定义 ============ */
const P={
 tree:{name:'几个人种树',mode:'slider',varLabel:'人数 n',min:1,max:12,start:4,answer:7,
   stem:'每人种 5 棵，还剩 3 棵；每人种 6 棵，还缺 4 棵。问有多少人、多少棵树？',
   L:n=>5*n+3,R:n=>6*n-4,lx:n=>`5×${n}+3`,rx:n=>`6×${n}−4`,unit:'棵',icon:'tree',
   talk:'同一批树，<b>总数没变</b>，只是每人分的棵数变了。左边是实际的树，右边想每人6棵还差4棵。两边相等，人就求出来了。'},
 save:{name:'存了多少本金',mode:'slider',varLabel:'本金 x（元）',min:12000,max:26000,step:200,start:18000,answer:20000,
   stem:'一笔钱存三年定期，年利率 2.2%，到期本金加利息共 21320 元。问本金多少？',
   L:x=>Math.round(x*1.066),R:()=>21320,lx:x=>`${x}×1.066`,rx:()=>'21320',unit:'元',icon:'coin',
   talk:'本金加上三年利息（本金的 6.6%），<b>正好等于 21320</b>。蓝色是本金、金色是利息，两部分凑成总数。'},
 parts:{name:'零件总数',mode:'slider',varLabel:'零件总数 x（个）',min:1200,max:4200,step:120,start:2400,answer:2880,
   stem:'原计划每天做 120 个，实际每天 160 个，提前 6 天完成。问这批零件共多少个？',
   L:x=>Math.round(x/120-x/160),R:()=>6,lx:x=>`${x}/120 − ${x}/160`,rx:()=>'6',unit:'天',icon:'box',
   talk:'同一批零件，慢做用的天数多、快做用的天数少，<b>两种做法的天数差正好是 6</b>。'},
 bus:{name:'春游租车',mode:'slider',varLabel:'原计划租车 n（辆）',min:2,max:9,start:3,answer:5,
   stem:'租 45 座有 15 人没座；改 60 座可少租 1 辆且正好坐满。问共多少人、原计划几辆？',
   L:n=>45*n+15,R:n=>60*(n-1),lx:n=>`45×${n}+15`,rx:n=>`60×(${n}−1)`,unit:'人',icon:'person',
   talk:'同一批人，<b>人数没变</b>。左边 45 座车坐满还站着 15 人，右边 60 座车少一辆正好坐满。'},
 box:{name:'每箱装多少',mode:'slider',varLabel:'每箱 x（个）',min:4,max:20,start:8,answer:12,
   stem:'5 台 A 机产品装满 8 箱剩 4 个；7 台 B 机装满 11 箱剩 1 个；每台 A 比 B 多产 1 个。问每箱多少个？',
   L:x=>Math.round((8*x+4)/5),R:x=>Math.round((11*x+1)/7)+1,lx:x=>`(8×${x}+4)/5`,rx:x=>`(11×${x}+1)/7 +1`,unit:'个',icon:'gear',
   talk:'先算每台机器一天产多少：A 机每台比 B 机每台 <b>正好多 1 个</b>。调到两边相等，每箱个数就出来了。'},
 tunnel:{name:'挖隧道',mode:'play',stem:'146 米隧道，3 天共挖 26 米，甲每天比乙多挖 2 米。问还要多少天？'},
 work:{name:'甲乙合作',mode:'play',stem:'甲 20 天、乙 30 天完成；甲先单独做 4 天，剩下合做 x 天做完。'},

/* ============ 打开题目 ============ */
function openProblem(pid){
  curProb=pid;const p=P[pid];
  $('#prob-title').textContent=p.name;
  $('#board-name').textContent=p.name;
  $('#board-hint').textContent='';
  if(p.mode==='slider') initSlider(p); else initPlay(p);
  show('problem');
}

/* ---- 滑块型 ---- */
function initSlider(p){
  const showAnswer=location.hash.split('/')[3]==='answer';
  const initV=showAnswer?p.answer:p.start;
  const stage=$('#stage');
  stage.innerHTML=`<div class="col l"><h5>左边的算法</h5><div class="big-num" id="nl">0</div><div class="unit">${p.unit}</div><div class="items" id="il"></div></div>
    <div class="eq-center" id="eqc">=</div>
    <div class="col r"><h5>右边的算法</h5><div class="big-num" id="nr">0</div><div class="unit">${p.unit}</div><div class="items" id="ir"></div></div>`;
  $('#ctrl-card').innerHTML=`<div class="slider-row"><input type="range" id="rng" min="${p.min}" max="${p.max}" step="${p.step||1}" value="${initV}"><div class="range-val" id="rv">${initV}</div></div><div class="var-label">${p.varLabel}</div>`;
  $('#talk').innerHTML=p.talk;
  const rng=$('#rng');
  function refresh(){
    const v=parseFloat(rng.value);$('#rv').textContent=v;
    const lv=p.L(v),rv=p.R(v);
    $('#nl').textContent=lv;$('#nr').textContent=rv;
    // 图标（最多展示16个，避免拥挤）
    $('#il').innerHTML=ICON[p.icon]('#3B82F6').repeat(Math.min(16,Math.max(0,Math.round(lv))));
    $('#ir').innerHTML=ICON[p.icon]('#F59E0B').repeat(Math.min(16,Math.max(0,Math.round(rv))));
    const bal=Math.abs(lv-rv)<1e-9*Math.max(1,Math.abs(lv),Math.abs(rv));
    $('#eqc').classList.toggle('on',bal);
    renderEq(p.lx(v),p.rx(v),lv,rv,bal);
    if(bal){done.add(curProb);$('#board-hint').textContent='✓ 相等啦';}else $('#board-hint').textContent='';
  }
  rng.oninput=refresh;refresh();
}

/* ---- 播放型场景定义 ---- */
const near=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
const fmt=x=>Math.round(x*100)/100;

let playTimer=null;
function initPlay(p){
  const cfg=PLAY[curProb];
  clearInterval(playTimer);
  $('#talk').innerHTML=cfg.talk;
  const showAnswer=location.hash.split('/')[3]==='answer';
  let v=showAnswer?cfg.answer:cfg.start;
  $('#stage').innerHTML='';
  const note=document.createElement('div');note.className='note-line';
  $('#stage').appendChild(note);
  const body=document.createElement('div');
  body.style.cssText='flex:1;display:flex;align-items:center;width:100%;overflow:auto;min-height:0';
  $('#stage').appendChild(body);
  $('#ctrl-card').innerHTML=`<div class="slider-row"><input type="range" id="rng" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${v}"><div class="range-val" id="rv">${fmt(v)}</div></div>
    <div class="var-label">${cfg.label}</div>
    <div style="margin-top:12px"><button class="btn primary" id="play-auto" style="width:100%">▶ 自动演示给我看</button></div>`;
  const rng=$('#rng');
  function draw(){
    v=parseFloat(rng.value);
    $('#rv').textContent=fmt(v);
    note.innerHTML=cfg.note(v);
    body.innerHTML=cfg.scene(v);
    if(cfg.kind==='decision'){
      const ok=v===cfg.answer;
      $('#eq').innerHTML=`<span class="eq-side eq-l">方案一 10500</span><span class="eq-op">&lt;</span><span class="eq-side eq-r">方案二 12000</span>`;
      $('#eq').classList.toggle('balanced',ok);
      $('#flag').textContent=ok?'✓ 比出来了：方案二更划算，多赚 1500 元':'';
      $('#flag').classList.toggle('show',ok);
      $('#board-hint').textContent=ok?'✓ 方案二多赚 1500 元':'';
      if(ok)done.add(curProb);
    }else{
      const o=cfg.vals(v);
      renderEq(o.lx,o.rx,o.l,o.r,o.bal);
      $('#board-hint').textContent=o.bal?'✓ 相等啦':'';
      if(o.bal)done.add(curProb);
    }
  }
  rng.oninput=()=>{clearInterval(playTimer);draw();};
  $('#play-auto').onclick=()=>{
    clearInterval(playTimer);
    if(parseFloat(rng.value)===cfg.answer) rng.value=cfg.start;
    playTimer=setInterval(()=>{
      const cur=parseFloat(rng.value);let nv=cur+cfg.step;
      if(nv>=cfg.answer){nv=cfg.answer;clearInterval(playTimer);}
      rng.value=nv;draw();
    },650);
  };
  draw();
}

/* ---- 相等面板 ---- */
function renderEq(lx,rx,lv,rv,bal){
  $('#eq').innerHTML=`<span class="eq-side eq-l">${lx} = ${lv}</span><span class="eq-op">=</span><span class="eq-side eq-r">${rx} = ${rv}</span>`;
  $('#eq').classList.toggle('balanced',bal);
  $('#flag').textContent='✓ 两边相等！这一刻的数，就是方程的解';
  $('#flag').classList.toggle('show',bal);
}
applyHash();
