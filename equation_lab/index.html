<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相等关系实验室 · 方程应用题</title>
<style>
:root{
  --bg:#F4F7FB;--card:#fff;--ink:#1E293B;--sub:#64748B;--line:#E2E8F0;
  --blue:#3B82F6;--teal:#14B8A6;--purple:#8B5CF6;--pink:#EC4899;--orange:#F59E0B;--green:#10B981;
  --red:#EF4444;--shadow:0 4px 18px rgba(15,23,42,.07);--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5}
#app{min-height:100vh}
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font-family:inherit}
:focus-visible{outline:3px solid #6366F1;outline-offset:2px;border-radius:8px}
/* 通用按钮 */
.btn{border:none;cursor:pointer;font-size:14px;font-weight:700;border-radius:12px;padding:11px 18px;
  background:#fff;color:var(--ink);border:2px solid var(--line);transition:.15s;min-height:44px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green);font-size:15px;padding:13px 22px}
.btn.ghost{background:#F1F5F9}
.toolbox-link{border-color:#F59E0B;color:#B45309;background:#FFFBEB;font-weight:800}
#home-toolbox{margin:18px auto 0;display:block}
.mode-tabs .toolbox-link{border-radius:999px;padding:8px 14px;font-size:12.5px;min-height:0;margin-right:4px}
/* 首页 */
.hero{padding:38px 20px 30px;text-align:center;max-width:1080px;margin:0 auto}
.hero-badge{display:inline-block;background:#EFF6FF;color:var(--blue);font-weight:800;font-size:13px;
  padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(26px,5vw,38px);margin:16px 0 10px}
.lead{color:var(--sub);font-size:15px;max-width:620px;margin:0 auto}
.zone-row{display:flex;gap:18px;margin-top:30px;text-align:left}
.zone-card{flex:1;background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
  cursor:pointer;border:2px solid transparent;width:100%;text-align:left}
.zone-card.basic{border-top:5px solid var(--blue)}
.zone-card.adv{border-top:5px solid var(--purple)}
.zone-tag{font-size:12px;font-weight:800;color:var(--sub)}
.zone-card h3{margin:8px 0 6px;font-size:19px}
.zone-card p{font-size:13.5px;color:var(--sub);margin:0 0 14px}
.pill{display:inline-block;background:#F1F5F9;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;margin-right:6px}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 18px;position:sticky;top:0;background:var(--bg);z-index:5}
.crumb{font-weight:800;font-size:17px}
/* 地图 */
.map-wrap{padding:6px 18px 40px;max-width:1080px;margin:0 auto}
.theme-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.theme-head{display:flex;align-items:center;gap:12px;padding:16px 20px;color:#fff}
.theme-head .dot{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800}
.theme-head h2{margin:0;font-size:17px}
.theme-head .tsub{font-size:12.5px;opacity:.9;font-weight:400}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px 20px 20px}
.tile{border:2px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;background:#fff;
  transition:.15s;text-align:left;min-height:44px}
.tile .no{font-size:11px;font-weight:800;color:var(--sub)}
.tile .nm{font-size:14px;font-weight:800;margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .st{font-size:11px;font-weight:800;display:flex;gap:5px}
.tile .st i{font-style:normal;color:var(--sub)}
.tile .st i.on{color:var(--green)}
.tile .st i.on.hint{color:var(--orange)}
/* 题卡左右布局 */
.card-shell{display:grid;grid-template-columns:1fr;max-width:1080px;margin:0 auto}
.card-rail{display:none}
.card-main{min-width:0}
.card-scroll{padding:0 18px 46px}
.stem-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;
  border-left:6px solid var(--blue);font-size:15px}
.stem-box .qlabel{font-size:12px;font-weight:800;color:var(--blue);display:block;margin-bottom:6px}
.stage-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px;min-height:240px}
.stage-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
/* 模式切换 */
.mode-tabs{display:flex;gap:8px;margin-left:auto}
.mode-tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;
  font-weight:800;color:var(--sub);cursor:pointer;min-height:38px}
.mode-tab.active{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
/* 想一想 */
.think{width:100%;border:2px dashed #C7D2FE;border-radius:14px;padding:14px 16px;background:#F8FAFF}
.think-q{font-size:14px;font-weight:800;color:#3730A3;margin-bottom:10px}
.think-row{display:flex;gap:10px;flex-wrap:wrap}
.think-opt{background:#fff;border:2px solid #C7D2FE;color:#3730A3;padding:9px 14px;min-height:42px;font-size:13.5px}
.think-fb{font-size:13px;font-weight:700;margin-top:10px;min-height:20px}
.think-bad{color:var(--red)}
.think-ok{color:#059669}
/* 揭示 */
.reveal{border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;color:#fff;display:none}
.reveal.show{display:block;animation:fade .4s}
.reveal.r1{background:linear-gradient(120deg,#3B82F6,#6366F1)}
.reveal.r2{background:linear-gradient(120deg,#059669,#10B981)}
.reveal .rtag{font-size:12px;font-weight:800;opacity:.85;display:block;margin-bottom:6px}
.reveal .formula{font-size:clamp(16px,3vw,21px);font-weight:800}
.reveal .note{font-size:13.5px;margin-top:8px;opacity:.95}
/* 通用场景元素 */
.act-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.svgicon{display:inline-block;vertical-align:middle}
.people-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* 水平条 */
.hbar{display:flex;width:100%;height:52px;border-radius:12px;overflow:hidden;background:#EEF2F7;border:1px solid var(--line)}
.hseg{display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;transition:width .5s cubic-bezier(.22,1,.36,1)}
.hseg.ghost-seg{background:#FCD34D;color:#92400E;border:2px dashed #F59E0B}
/* 水槽 */
.tank{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;width:100%;max-width:660px}
.cell{aspect-ratio:1;border-radius:3px;background:#EDF1F6;border:1px solid #E2E8F0;transition:.3s}
.cell.a{background:var(--blue);border-color:var(--blue)}
.cell.b{background:var(--orange);border-color:var(--orange)}
.cell.c{background:var(--teal);border-color:var(--teal)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--sub);font-weight:700;flex-wrap:wrap;justify-content:center}
.dotleg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 跑道 */
.runway{width:100%;position:relative;height:170px;background:repeating-linear-gradient(90deg,#F4F7FB 0 40px,#E8EEF6 40px 42px);
  border-radius:12px;border:1px solid var(--line);overflow:hidden}
.runner{position:absolute;transition:left .5s linear;display:flex;flex-direction:column;align-items:center;gap:2px}
.runner .rname{font-size:11px;font-weight:800}
/* 两本账 */
.cols{display:flex;gap:34px;align-items:flex-end;justify-content:center;height:230px;width:100%}
.pf{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.pf .pcol{width:84px;border-radius:12px 12px 6px 6px;display:flex;justify-content:center;align-items:flex-start;
  color:#fff;font-weight:800;font-size:14px;padding-top:8px;transition:height .7s cubic-bezier(.22,1,.36,1)}
.pf .plabel{font-size:12.5px;font-weight:800;color:var(--sub);text-align:center}
/* 时间轴 */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.day{background:#F1F5F9;border-radius:10px;padding:10px 8px;min-height:80px;font-size:11.5px;color:var(--sub)}
.day b{display:block;font-size:12px;color:var(--ink);margin-bottom:4px}
.day .task{background:#fff;border-radius:7px;padding:5px 7px;margin-top:5px;font-weight:700;font-size:11px}
/* 费用表 */
.fee-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.fee-table th,.fee-table td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.fee-table th{background:#F8FAFC;font-weight:800}
.fee-table .best{background:#ECFDF5;font-weight:800;color:#059669}
/* 输入框 */
.eq-input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:17px;font-weight:700;
  font-family:inherit;outline:none;min-height:48px}
.eq-input:focus{border-color:var(--blue)}
.input-fb{font-size:13px;font-weight:700;min-height:20px}
.answer-row{display:flex;flex-direction:column;gap:10px;width:100%;align-items:stretch}
/* 单位检查卡片 */
.unit-card{border:2px solid #FECACA;border-radius:14px;background:#FFF7F7;padding:14px 16px;margin-top:4px}
.unit-title{font-size:12.5px;font-weight:800;color:#B91C1C;margin-bottom:10px}
.unit-eq{font-size:15px;font-weight:800;line-height:2.1;word-break:break-word;color:var(--ink)}
.ut{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:1px 7px;margin:0 2px;white-space:nowrap}
.ut-L{background:#DBEAFE;color:#1D4ED8}
.ut-T{background:#FEF3C7;color:#B45309}
.ut-LT{background:#EDE9FE;color:#6D28D9}
.ut-M{background:#D1FAE5;color:#047857}
.ut-unk{background:#F1F5F9;color:#64748B}
.ut-res{border:1.5px solid currentColor;margin-left:6px}
.clash-op{color:#fff;background:var(--red);border-radius:7px;padding:1px 9px;font-weight:900}
.unit-note{font-size:13.5px;font-weight:800;color:var(--red);margin-top:10px}
.unit-hint{font-size:13px;font-weight:700;color:#3730A3;background:#EEF2FF;border-radius:10px;padding:9px 12px;margin-top:8px;line-height:1.6}
.unit-fix{margin-top:12px;background:#fff;border-color:var(--red);color:var(--red);min-height:42px;padding:9px 18px}
/* 等式构建：依据卡、公式条、分步含义 */
.basis-card{border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:#F8FAFC;width:100%}
.basis-badge{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.basis-badge.bs{background:#DBEAFE;color:#1D4ED8}
.basis-badge.bf{background:#EDE9FE;color:#6D28D9}
.formula-strip{background:linear-gradient(120deg,#4F46E5,#7C3AED);color:#fff;border-radius:11px;
  padding:12px 15px;font-size:16px;font-weight:800;line-height:1.7;margin-bottom:12px;word-break:break-word}
.relation-line{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.7}
.step-meaning{background:#ECFDF5;border-left:4px solid var(--green);border-radius:9px;padding:10px 13px;
  font-size:13.5px;font-weight:700;color:#065F46;margin:10px 0;line-height:1.7}
.step-bad{color:var(--red);font-weight:800}
.my-eq-bar{background:#F5F3FF;border:1px solid #DDD6FE;border-left:4px solid var(--purple);border-radius:9px;
  padding:10px 13px;margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.meb-label{font-size:12px;font-weight:900;color:var(--purple)}
.meb-formula{font-size:16px;font-weight:900;color:#4C1D95;word-break:break-all}
.discover-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.guide-box{background:#FFFBEB;border:1px solid #FDE68A;border-left:4px solid #F59E0B;border-radius:9px;
  padding:12px 14px;margin-bottom:10px;font-size:15px;font-weight:700;color:#92400E;line-height:1.75}
.basic-eq-card{border-radius:12px;padding:13px 15px;margin-bottom:12px;border:1px solid var(--line);
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.beq-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.beq-name{font-size:15px;font-weight:900;color:var(--ink)}
.beq-cat{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;color:#fff}
.beq-formula{font-size:17px;font-weight:900;line-height:1.6;word-break:break-word}
.beq-运动{border-left:5px solid #3B82F6}.beq-运动 .beq-cat{background:#3B82F6}.beq-运动 .beq-formula{color:#1D4ED8}
.beq-工程{border-left:5px solid #8B5CF6}.beq-工程 .beq-cat{background:#8B5CF6}.beq-工程 .beq-formula{color:#6D28D9}
.beq-金钱{border-left:5px solid #10B981}.beq-金钱 .beq-cat{background:#10B981}.beq-金钱 .beq-formula{color:#047857}
.beq-分配{border-left:5px solid #F59E0B}.beq-分配 .beq-cat{background:#F59E0B}.beq-分配 .beq-formula{color:#B45309}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;
  padding:24px 14px;overflow-y:auto}
.modal-overlay.active{display:flex;justify-content:center;align-items:flex-start}
.modal-box{background:#F8FAFC;border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  overflow:hidden;margin:auto 0}
.modal-head{position:relative;padding:18px 20px 14px;background:#fff;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0 0 4px;font-size:20px;font-weight:900}
.modal-head p{margin:0;font-size:13.5px;color:var(--sub);line-height:1.6;padding-right:64px}
.modal-close{position:absolute;top:16px;right:16px}
.modal-body{padding:16px 20px 22px;max-height:70vh;overflow-y:auto}
.toolbox-group{font-size:13px;font-weight:900;color:var(--sub);letter-spacing:1px;margin:14px 0 9px}
.toolbox-group:first-child{margin-top:2px}
.toolbox-entry{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:9px}
.toolbox-entry .te-name{font-size:14px;font-weight:900;margin-bottom:3px}
.toolbox-entry .te-formula{font-size:15.5px;font-weight:900;line-height:1.5;word-break:break-word}
.toolbox-entry.te-运动{border-left:4px solid #3B82F6}.toolbox-entry.te-运动 .te-formula{color:#1D4ED8}
.toolbox-entry.te-工程{border-left:4px solid #8B5CF6}.toolbox-entry.te-工程 .te-formula{color:#6D28D9}
.toolbox-entry.te-金钱{border-left:4px solid #10B981}.toolbox-entry.te-金钱 .te-formula{color:#047857}
.toolbox-entry.te-分配{border-left:4px solid #F59E0B}.toolbox-entry.te-分配 .te-formula{color:#B45309}
/* 滑块 */
input[type=range]{width:100%;-webkit-appearance:none;height:10px;border-radius:999px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--blue);box-shadow:0 2px 8px rgba(59,130,246,.5);cursor:pointer;border:3px solid #fff}
.range-wrap{width:100%;display:flex;flex-direction:column;gap:8px}
.range-cap{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--sub);gap:8px}
.range-val{font-size:22px;font-weight:800;color:var(--blue);text-align:center}
/* 托盘 */
.tray{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.tray-row{display:flex;gap:8px;align-items:center;justify-content:center;min-height:40px;flex-wrap:wrap}
.slot{width:38px;height:38px;border-radius:9px;border:2px dashed #CBD5E1;display:grid;place-items:center;
  font-size:15px;background:#fff}
.slot.fill{border-style:solid}
.slot.ja{background:#DBEAFE;border-color:var(--blue)}
.slot.jb{background:#FFEDD5;border-color:var(--orange)}
.scrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px;font-size:12px;font-weight:800;color:var(--sub)}
/* 左侧只读进度 */
.rail-head{font-size:12px;font-weight:800;color:var(--sub);padding:0 8px 10px}
.rail-list{display:flex;flex-direction:column;gap:6px}
.rail-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:11px;padding:9px 11px;cursor:pointer;min-height:42px}
.rail-item.current{border-color:#6366F1;background:#EEF2FF}
.rail-item .rn{flex:1;font-size:13px;font-weight:700}
.rail-item .rs{font-size:11px;font-weight:800;display:flex;gap:4px}
.rail-item .rs i{font-style:normal;color:#CBD5E1}
.rail-item .rs i.on{color:var(--green)}
.rail-item .rs i.on.hint{color:var(--orange)}
.rail-back{width:100%;margin-top:10px}
@media (min-width:980px){
  .card-shell{grid-template-columns:264px 1fr;gap:24px;padding:0 24px}
  .card-rail{display:block;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:20px 0}
  .card-topbar{padding:16px 0}
}
@media (max-width:720px){
  .zone-row{flex-direction:column}
  .cols{gap:18px}
  .pf .pcol{width:64px}
  .stage-box{padding:18px 14px}
}
</style>
</head>
<body>
<div id="app">
  <!-- ===== 视图：首页 ===== -->
  <section class="view" id="view-home">
    <div class="hero">
      <span class="hero-badge">相等关系实验室</span>
      <h1>动手做，看懂“相等”</h1>
      <p class="lead">每道题只做一个动作。先看见题目里的东西怎么变得相等，再把这一刻记成方程。做完还有一道换题，自己试。</p>
      <div class="zone-row">
        <button class="zone-card basic" data-zone="basic" type="button">
          <div class="zone-tag">第一块 · 先玩这里</div>
          <h3>基础室</h3>
          <p>同一批东西怎么分、几段怎么凑成整体。</p>
          <span class="pill">2 个主题</span><span class="pill">8 张题卡</span>
        </button>
        <button class="zone-card adv" data-zone="adv" type="button">
          <div class="zone-tag">第二块 · 基础玩透再来</div>
          <h3>进阶室</h3>
          <p>追上去、配成套、两本账比一比。</p>
          <span class="pill">3 个主题</span><span class="pill">3 张题卡</span>
        </button>
      </div>
      <button class="btn toolbox-link" id="home-toolbox" type="button">打开基本等式工具箱</button>
    </div>
  </section>

  <!-- ===== 视图：地图 ===== -->
  <section class="view" id="view-map">
    <div class="topbar"><button class="btn" id="map-back" type="button">← 返回首页</button><div class="crumb" id="map-title"></div></div>
    <div class="map-wrap" id="map-wrap"></div>
  </section>

  <!-- ===== 视图：题卡 ===== -->
  <section class="view" id="view-card">
    <div class="card-shell">
      <aside class="card-rail" id="card-rail"></aside>
      <main class="card-main">
        <div class="topbar card-topbar">
          <button class="btn" id="card-back" type="button">← 地图</button>
          <div class="crumb" id="card-title"></div>
          <div class="mode-tabs" role="group" aria-label="学习模式">
            <button class="btn toolbox-link" id="card-toolbox" type="button">等式工具箱</button>
            <button class="mode-tab active" id="mode-main" type="button">演示学习</button>
            <button class="mode-tab" id="mode-drill" type="button">独立换题</button>
          </div>
        </div>
        <div class="card-scroll">
          <div class="stem-box"><span class="qlabel">完整题目</span><span id="stem-text"></span></div>
          <div class="stage-box"><div class="stage-inner" id="stage"></div></div>
          <div class="reveal r1" id="rev1"><span class="rtag">第一步 · 我看见关系了</span><div class="formula" id="rev1-f"></div><div class="note" id="rev1-n"></div></div>
          <div class="reveal r2" id="rev2"><span class="rtag">第二步 · 把答案代回图里核对</span><div class="formula" id="rev2-f"></div><div class="note" id="rev2-n"></div></div>
        </div>
      </main>
    </div>
  </section>

  <!-- ===== 弹层：基本等式工具箱 ===== -->
  <div class="modal-overlay" id="toolbox-modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="基本等式工具箱">
      <div class="modal-head">
        <h2>基本等式工具箱</h2>
        <p>这些关系会反复用到，多看几遍，记牢它们</p>
        <button class="btn modal-close" id="toolbox-close" type="button">关闭</button>
      </div>
      <div class="modal-body" id="toolbox-body"></div>
    </div>

</div>

<script>
/* =========================================================
   通用工具
========================================================= */
const $=s=>document.querySelector(s);
const views={home:$('#view-home'),map:$('#view-map'),card:$('#view-card')};
function show(v){Object.values(views).forEach(x=>x.classList.remove('active'));views[v].classList.add('active');}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function clearNode(n){while(n.firstChild)n.removeChild(n.firstChild);}
const near=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
const r2=x=>Math.round(x*100)/100; // 仅用于显示，不参与判定
function toHalfWidth(s){return (s||'').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ')
  .replace(/[−‐–—]/g,'-').replace(/[×✕✖]/g,'*').replace(/÷/g,'/');}
function numOf(s){if(s==null)return null;const n=parseFloat(toHalfWidth(s).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
/* SVG 图标 */
const SVG={
 tree:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L18 9 H15 L20 15 H13 V22 H11 V15 H4 L9 9 H6 Z" fill="${c}"/></svg>`,
 book:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M5 3 H16 a2 2 0 0 1 2 2 V21 H6 a2 2 0 0 1-2-2 Z" fill="${c}"/><path d="M9 7 H14 M9 11 H14" stroke="#fff" stroke-width="1.5"/></svg>`,
 coin:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="${c}"/><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">¥</text></svg>`,
 box:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M3 7 L12 3 L21 7 V18 L12 22 L3 18 Z" fill="${c}"/><path d="M3 7 L12 11 L21 7 M12 11 V22" stroke="#fff" stroke-width="1.3" fill="none"/></svg>`,
 person:c=>`<svg class="svgicon" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.4" fill="${c}"/><path d="M5 21 C5 15 8 13 12 13 C16 13 19 15 19 21 Z" fill="${c}"/></svg>`
};
/* 揭示面板 */
function showReveal(which,formula,note){
  const box=$('#rev'+which);
  $('#rev'+which+'-f').innerHTML=formula;
  const n=$('#rev'+which+'-n');if(n)n.innerHTML=note||'';
  box.classList.add('show');
}
function resetReveals(){['1','2'].forEach(k=>$('#rev'+k).classList.remove('show'));}
/* 想一想：判断问题，答错给线索，答对才放行 */
function thinkBox(question,options){
  const root=el('div','think');
  const q=el('div','think-q',question);
  const row=el('div','think-row');
  const fb=el('div','think-fb');
  let answered=false;const api={root,onPass:null,onError:null};
  options.forEach(o=>{
    const b=el('button','btn think-opt');b.type='button';b.textContent=o.label;
    b.onclick=()=>{
      if(answered)return;
      if(o.correct){answered=true;fb.innerHTML='<span class="think-ok">对，看下一步</span>';
        row.querySelectorAll('button').forEach(x=>x.disabled=true);if(api.onPass)api.onPass();}
      else {fb.innerHTML='<span class="think-bad">再想想。'+(o.hint||'')+'</span>';if(api.onError)api.onError();}
    };
    row.appendChild(b);
  });
  root.append(q,row,fb);
  api.destroy=()=>row.querySelectorAll('button').forEach(b=>b.onclick=null);
  return api;
}
/* 答案输入：数字 */
function answerRow(placeholder,onSubmit){
  const root=el('div','answer-row');
  const inp=el('input');inp.className='eq-input';inp.type='text';inp.placeholder=placeholder;
  const fb=el('div','input-fb');
  const b=el('button','btn go');b.type='button';b.textContent='核对';
  b.onclick=()=>{fb.innerHTML='';onSubmit(inp.value,fb);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')b.click();});
  root.append(inp,fb,b);
  return{root,destroy(){b.onclick=null;}};
}
/* 一元一次方程判定：唯一根、线性、全角兼容 */
function parseLinear(expr,root){
  const e=toHalfWidth(expr).replace(/[tT]/g,'x');
  if(!e.includes('='))return{err:'要有等号，写成左右两边相等'};
  const parts=e.split('=');
  if(parts.length!==2)return{err:'只能有一个等号'};
  const bare=s=>/^x$/.test(s.replace(/\s/g,''));
  const noX=s=>!/x/.test(s);
  if((bare(parts[0])&&noX(parts[1]))||(bare(parts[1])&&noX(parts[0])))
    return{err:'这是答案，不是方程。先把题目里的关系写成等式，再解'};
  const mk=s=>{
    let c=s.replace(/[^0-9x+\-*/(). ]/g,'');
    c=c.replace(/(\d)(?=[x(])/g,'$1*').replace(/\)(?=[x(\d])/g,')*').replace(/x(?=[\d(])/g,'x*');
    try{const fn=Function('x','return ('+c+')');fn(1);return fn;}catch{return null;}
  };
  const L=mk(parts[0]),R=mk(parts[1]);
  if(!L||!R)return{err:'式子没写对，检查运算符号和括号'};
  const d=x=>L(x)-R(x);
  if(!near(d(root),0))return{err:'x='+root+' 代进去，两边不相等'};
  const a=root+1,bx=root+3.7;
  const da=d(a),db=d(bx);
  if(near(da,0)||near(db,0))return{err:'这是恒等式或有多个根，不是一元一次方程'};
  const s1=da/(a-root),s2=(db-da)/(bx-a);
  if(!near(s1,s2))return{err:'这是高次方程，有多个根；题目要一元一次'};
  return{ok:true};
}

/* =========================================================
   单位检查：先看每一项是不是同一种东西，再谈算得对不对
   维度 L=长度/工作量，T=时间，M=金钱；复合如 L/T 用指数对象
========================================================= */
/* 单位字符串（如“米/天”“个”）→ 单位向量：基础单位名 → 指数 */
function unitVec(s){
  const v={};
  if(!s)return v;
  const parts=String(s).split('/');
  const add=(str,sign)=>{if(!str)return;for(const ch of str){if(ch==='*'||ch==='·')continue;v[ch]=(v[ch]||0)+sign;}};
  add(parts[0],1);add(parts[1],-1);
  Object.keys(v).forEach(k=>{if(v[k]===0)delete v[k];});
  return v;
}
function sameUnit(a,b){
  const ka=Object.keys(a),kb=Object.keys(b);
  if(ka.length!==kb.length)return false;
  return ka.every(k=>a[k]===b[k]);
}
/* 乘（sign=1）/ 除（sign=-1）合并单位，零指数自动清掉 */
function mergeUnit(a,b,sign){
  const r={...a};
  Object.keys(b).forEach(k=>r[k]=(r[k]||0)+sign*b[k]);
  Object.keys(r).forEach(k=>{if(r[k]===0)delete r[k];});
  return r;
}
function numUnitOf(v,model){
  if(!model._numMap){
    const mp=new Map();
    Object.keys(model.numUnits||{}).forEach(k=>mp.set(Number(k),unitVec(model.numUnits[k])));
    model._numMap=mp;
  }
  return model._numMap.has(v)?model._numMap.get(v):null;
}
function vecText(v){
  const num=[],den=[];
  Object.keys(v).forEach(k=>{const e=v[k];for(let i=0;i<Math.abs(e);i++)(e>0?num:den).push(k);});
  return num.join('')+(den.length?'/'+den.join(''):'');
}
/* 单位颜色：取分子第一个基础单位，按 model.palette 选色 */
function unitColor(v,model){
  const keys=Object.keys(v);
  const pos=keys.find(k=>v[k]>0)||keys[0];
  return(model.palette&&model.palette[pos])||'unk';
}
/* 分词：全角先转半角，x/t 都当变量 */
function tokenize(str){
  const s=toHalfWidth(str).replace(/\s+/g,'');
  const toks=[];let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/[0-9.]/.test(ch)){
      let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      toks.push({t:'n',v:parseFloat(s.slice(i,j))});i=j;
    }else if(ch==='x'||ch==='X'||ch==='t'||ch==='T'){toks.push({t:'x'});i++;}
    else if('+-*/()'.includes(ch)){toks.push({t:ch});i++;}
    else i++;
  }
  return toks;
}
/* 递归下降解析，支持隐式乘法：240t、(t+12)、3(x+1) */
function parseAst(str){
  const toks=tokenize(str);let p=0;
  const peek=()=>toks[p];
  const eat=v=>{if(toks[p]&&toks[p].t===v){p++;return true;}return false;};
  function parseFactor(){
    const tk=peek();
    if(!tk)throw new Error('空');
    if(tk.t==='n'){p++;return{k:'n',v:tk.v};}
    if(tk.t==='x'){p++;return{k:'x'};}
    if(tk.t==='('){p++;const e=parseTop();if(!eat(')'))throw new Error('括号');return e;}
    if(tk.t==='-'){p++;return{k:'op',op:'-',a:{k:'n',v:0},b:parseFactor()};}
    if(tk.t==='+'){p++;return parseFactor();}
    throw new Error('符号');
  }
  function startsFactor(){const tk=peek();return tk&&(tk.t==='n'||tk.t==='x'||tk.t==='(');}
  function parseTerm(){
    let node=parseFactor();
    for(;;){
      if(peek()&&peek().t==='*'){p++;node={k:'op',op:'*',a:node,b:parseFactor()};}
      else if(peek()&&peek().t==='/'){p++;node={k:'op',op:'/',a:node,b:parseFactor()};}
      else if(startsFactor()){node={k:'op',op:'*',a:node,b:parseFactor()};}
      else break;
    }
    return node;
  }
  function parseTop(){
    let node=parseTerm();
    while(peek()&&(peek().t==='+'||peek().t==='-')){
      const op=peek().t;p++;
      node={k:'op',op,a:node,b:parseTerm()};
    }
    return node;
  }
  const ast=parseTop();
  if(p!==toks.length)throw new Error('多余符号');
  return ast;
}
function evalAst(n,x){
  if(n.k==='n')return n.v;
  if(n.k==='x')return x;
  const a=evalAst(n.a,x),b=evalAst(n.b,x);
  if(n.op==='+')return a+b;
  if(n.op==='-')return a-b;
  if(n.op==='*')return a*b;
  return a/b;
}
/* 分步表达式判定：孩子写的式子和目标式子在多个 x 点等价才算对 */
function exprMatch(input,expect){
  if(input==null||!(''+input).trim())return false;
  let a,b;
  try{a=parseAst(input);}catch{return false;}
  try{b=(typeof expect==='string')?parseAst(expect):expect;}catch{return false;}
  const pts=[0.5,1,2,3,5,7,11,13];
  for(const x of pts){
    let va,vb;
    try{va=evalAst(a,x);vb=evalAst(b,x);}catch{return false;}
    if(!isFinite(va)||!isFinite(vb)){if(!isFinite(va)&&!isFinite(vb))continue;return false;}
    if(!near(va,vb))return false;
  }
  return true;
}
/* 单位标签：叶子挂单位，颜色按 palette；无量纲不挂 */
function unitTag(v,model){
  if(!v||Object.keys(v).length===0)return'';
  return` <span class="ut ut-${unitColor(v,model)}">${vecText(v)}</span>`;
}
/* 推单位，冲突记进 clashes，含未知量则该子树返回 null（不冤枉） */
function dimOf(node,model,clashes){
  if(node.k==='n')return numUnitOf(node.v,model);
  if(node.k==='x')return model.xUnit;
  const da=dimOf(node.a,model,clashes),db=dimOf(node.b,model,clashes);
  if(da===null||db===null)return null;
  if(node.op==='*')return mergeUnit(da,db,1);
  if(node.op==='/')return mergeUnit(da,db,-1);
  if(sameUnit(da,db))return da;
  clashes.push({da,db});
  return null;
}
/* 带单位渲染：叶子挂单位，冲突的加减号标红 */
function annotate(node,model){
  if(node.k==='n'){const u=numUnitOf(node.v,model);return{html:String(node.v)+unitTag(u,model),dim:u};}
  if(node.k==='x')return{html:(model.varName||'x')+unitTag(model.xUnit,model),dim:model.xUnit};
  const A=annotate(node.a,model),B=annotate(node.b,model);
  let dim=null;
  if(A.dim!==null&&B.dim!==null){
    if(node.op==='*')dim=mergeUnit(A.dim,B.dim,1);
    else if(node.op==='/')dim=mergeUnit(A.dim,B.dim,-1);
    else if(sameUnit(A.dim,B.dim))dim=A.dim;
  }
  const isClash=(node.op==='+'||node.op==='-')&&A.dim!==null&&B.dim!==null&&!sameUnit(A.dim,B.dim);
  const opSym=isClash?`<span class="clash-op">${node.op}</span>`:node.op;
  let html=`${A.html} ${opSym} ${B.html}`;
  if((node.op==='*'||node.op==='/')&&dim!==null)
    html+=` <span class="ut ut-${unitColor(dim,model)} ut-res">→${vecText(dim)}</span>`;
  return{html,dim};
}
/* 单位检查主入口：ok 通过 / clash 冲突 / syntax 语法 / unknown 看不准不拦截 */
function unitCheck(expr,model){
  if(typeof model.xUnit==='string')model.xUnit=unitVec(model.xUnit||'');
  const e=toHalfWidth(expr);
  if(!e.includes('='))return{state:'syntax'};
  const parts=e.split('=');
  if(parts.length!==2)return{state:'syntax'};
  let astL,astR;
  try{astL=parseAst(parts[0]);astR=parseAst(parts[1]);}catch{return{state:'syntax'};}
  const clashes=[];
  const dL=dimOf(astL,model,clashes),dR=dimOf(astR,model,clashes);
  const eqClash=dL!==null&&dR!==null&&!sameUnit(dL,dR);
  if(clashes.length===0&&!eqClash&&dL!==null&&dR!==null)return{state:'ok'};
  if(clashes.length>0||eqClash)
    return{state:'clash',hL:annotate(astL,model).html,hR:annotate(astR,model).html,clashes,eqClash};
  return{state:'unknown'};
}
function clashNote(uc){
  if(uc.clashes&&uc.clashes.length){
    const c=uc.clashes[0];
    return vecText(c.da)+' 和 '+vecText(c.db)+' 不是一种东西，不能直接加';
  }
  return'等号两边不是一种东西，对不上';
}
function unitCardHtml(uc,model){
  const eq=uc.eqClash?'<span class="clash-op">=</span>':'=';
  return `<div class="unit-card">
    <div class="unit-title">先看单位，每一项是不是同一种东西</div>
    <div class="unit-eq">${uc.hL} ${eq} ${uc.hR}</div>
    <div class="unit-note">${clashNote(uc)}</div>
    <div class="unit-hint">${model.hint||''}</div>
    <button type="button" class="btn unit-fix">我回去改</button>
  </div>`;
}
/* 方程输入：单位检查先过，再走数值判定；成功才 onPass */
function equationRow(placeholder,model,onPass){
  const root=el('div','answer-row');
  const inp=el('input');inp.className='eq-input';inp.type='text';inp.placeholder=placeholder;
  const fb=el('div','input-fb');
  const b=el('button','btn go');b.type='button';b.textContent='核对我的方程';
  b.onclick=()=>{
    let uc;
    try{uc=unitCheck(inp.value,model);}catch{uc={state:'unknown'};}
    if(uc.state==='clash'){
      fb.innerHTML=unitCardHtml(uc,model);
      const fix=fb.querySelector('.unit-fix');
      if(fix)fix.onclick=()=>{inp.focus();inp.select();};
      return;
    }
    const r=parseLinear(inp.value,model.x);
    if(r.ok)onPass(inp.value);
    else fb.innerHTML=`<span style="color:var(--red);font-weight:800">${r.err}</span>`;
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')b.click();});
  root.append(inp,fb,b);
  return{root,destroy(){b.onclick=null;}};
}

/* =========================================================
   等式构建主流程：找不变 → 看依据/公式 → 分步搭 → 自己写方程 → 解
   声明式配置，每题只给数据，不重复写流程
========================================================= */
/* =========================================================
   基本等式库：反复出现的关系，固定写法、有名字，让孩子记牢
   cat 类别：运动 / 工程 / 金钱 / 分配，各用一种颜色
========================================================= */
const BASIC_EQ={
 invariant:{cat:'分配',name:'同一批，总量不变',formula:'第一种分法的总量 = 第二种分法的总量',
   guide:'两种分法变的是“怎么分”。你看看分的是不是同一批东西？东西本身有没有变多、变少？'},
 speed:{cat:'运动',name:'路程·速度·时间',formula:'路程 = 速度 × 时间',
   guide:'一个人走的路，跟他走多快、走多久有关。这三样怎么连起来？'},
 meet:{cat:'运动',name:'相遇：路程拼成全程',formula:'甲的路程 + 乙的路程 = 总距离',
   guide:'两人从两头往中间走。相遇时把两人走过的路拼起来，是不是正好整条路？'},
 chase:{cat:'运动',name:'追上：到同一点路程相等',formula:'良马路程 = 驽马路程',
   guide:'追上那一刻两人在同一个位置。从各自起点量到这个位置，两段路一样长吗？'},
 workrate:{cat:'工程',name:'效率·总量·天数',formula:'每天效率 = 总量 ÷ 单独天数',
   guide:'一个人单独做完要几天？把整项平均分到这些天，每天做多少？'},
 worktime:{cat:'工程',name:'时间·总量·效率',formula:'工作时间 = 总量 ÷ 每天效率',
   guide:'知道总共多少、每天做多少，要几天才做完？'},
 workadd:{cat:'工程',name:'几段接成整项',formula:'先做的 + 后来做的 = 整项总量',
   guide:'这项工程分几段完成？把几段的活儿接起来，是不是正好整项？'},
 interest:{cat:'金钱',name:'单利利息',formula:'利息 = 本金 × 年利率 × 年数',
   guide:'利息按哪笔钱算？利率、年数跟本金怎么连？'},
 amount:{cat:'金钱',name:'本利和',formula:'本利和 = 本金 + 利息',
   guide:'到期拿回来的钱，由哪两部分组成？'},
 price:{cat:'金钱',name:'总价·单价·数量',formula:'总价 = 单价 × 数量',
   guide:'每个东西一个价，买了若干个，一共多少钱？'},
 sets:{cat:'分配',name:'能配几套',formula:'套数 = 零件总数 ÷ 每套需要',
   guide:'一套要几个零件？手里这些零件，能凑出几套？'},
 profitrate:{cat:'金钱',name:'利润率',formula:'利润率 =（收入 − 成本）÷ 收入',
   guide:'先算赚了多少，再除以收入，赚的占收入多少？'}
};
function eqCard(id){
  const e=BASIC_EQ[id];
  return `<div class="basic-eq-card beq-${e.cat}">
    <div class="beq-head"><span class="beq-name">${e.name}</span><span class="beq-cat">${e.cat}等式</span></div>
    <div class="beq-formula">${e.formula}</div></div>`;
}
/* 题目直接说的关系：写法和等式卡统一，角标标明来自题目 */
function directCard(d){
  return `<div class="basic-eq-card beq-${d.cat}">
    <div class="beq-head"><span class="beq-name">${d.name}</span><span class="beq-cat">题目直接说的</span></div>
    <div class="beq-formula">${d.formula}</div></div>`;
}
/* 想 → 引导 → 选择：关系不直接给，逐步揭示 */
function discoverRelation(cfg,onPass){
  const root=el('div','discover');root.style.width='100%';
  const cleanups=[];
  let usedHint=false,level=0; // 0 自己想 / 1 看引导 / 2 选择
  const q=el('div','think-q',cfg.q);
  const guideBox=el('div','guide-box');guideBox.style.display='none';
  const inp=el('input');inp.className='eq-input';inp.type='text';
  inp.placeholder='先自己想，写下来；没思路也可以直接要提示';
  const fb=el('div','input-fb');
  const chooseSlot=el('div');
  const row=el('div','discover-row');
  const ok=el('button','btn go');ok.type='button';ok.textContent='我想出来了';
  const need=el('button','btn');need.type='button';need.textContent='没思路，给我点提示';
  function tryPass(){
    if(!cfg.tryCheck||cfg.tryCheck(inp.value))onPass();
    else fb.innerHTML=`<span class="step-bad">${cfg.tryHint||'再想想，或要个提示。'}</span>`;
  }
  ok.onclick=tryPass;
  need.onclick=()=>{
    usedHint=true;
    if(level===0){
      level=1;
      guideBox.innerHTML=cfg.guide;guideBox.style.display='block';
      need.textContent='还是不会，让我选';
      inp.placeholder='照着提示再试一次';
    }else{
      level=2;
      guideBox.style.display='none';
      inp.style.display='none';ok.style.display='none';need.style.display='none';
      const tb=thinkBox(cfg.chooseQ||'从下面选一条对的关系',cfg.choices);
      tb.onPass=onPass;
      chooseSlot.appendChild(tb.root);cleanups.push(tb.destroy);
    }
  };
  row.append(ok,need);
  root.append(q,guideBox,inp,fb,chooseSlot,row);
  return{root,usedHint:()=>usedHint,destroy(){cleanups.forEach(f=>{try{f();}catch{}});}};
}
function equationFlow(host,cfg){
  const mount=el('div');mount.style.width='100%';host.appendChild(mount);
  const cleanups=[];
  let hintUsed=false;
  function set(node){clearNode(mount);if(node)mount.appendChild(node);}
  function bundle(...nodes){const w=el('div');w.style.width='100%';nodes.forEach(n=>w.appendChild(n));return w;}
  function stageRelations(k){
    if(k>=cfg.relations.length){stageSteps(0);return;}
    const r=cfg.relations[k];
    const disc=discoverRelation(r,()=>{
      if(disc.usedHint())hintUsed=true;
      const wrap=el('div');wrap.style.width='100%';
      wrap.innerHTML=r.eqId?eqCard(r.eqId):directCard(r.direct);
      const b=el('button','btn go');b.type='button';
      b.textContent=(k===cfg.relations.length-1)?'关系定了，往下搭式子':'下一条关系';
      b.onclick=()=>stageRelations(k+1);
      cleanups.push(()=>b.onclick=null);wrap.appendChild(b);set(wrap);
    });
    set(disc.root);cleanups.push(disc.destroy);
  }
  function stageSteps(i){
    if(i>=cfg.steps.length){stageWriteEq();return;}
    const st=cfg.steps[i];
    const ar=answerRow(st.label,(val,fb)=>{
      const ok=st.check?st.check(val)
        :st.expectExpr?exprMatch(val,st.expectExpr)
        :near(numOf(val),st.expect);
      if(ok){
        const meaning=el('div','step-meaning');meaning.innerHTML=st.meaning;
        const b=el('button','btn go');b.type='button';
        b.textContent=(i===cfg.steps.length-1)?'分步搭完，我来写方程':'下一块';
        b.onclick=()=>stageSteps(i+1);
        cleanups.push(()=>b.onclick=null);
        set(bundle(ar.root,meaning,b));
      }else fb.innerHTML=`<span class="step-bad">${st.hint||'再想想，回到关系看。'}</span>`;
    });
    set(ar.root);cleanups.push(ar.destroy);
  }
  function stageWriteEq(){
    cfg.eq.model.x=cfg.solve.expect; // 数值根：parseLinear 用它验证方程在答案处成立
    const er=equationRow(cfg.eq.placeholder,cfg.eq.model,eqText=>stageSolve(eqText));
    set(er.root);cleanups.push(er.destroy);
  }
  function stageSolve(eqText){
    const myEq=el('div','my-eq-bar');
    const lab=el('span','meb-label');lab.textContent='我的方程';
    const f=el('span','meb-formula');f.textContent=eqText;
    myEq.append(lab,f);
    const ar=answerRow(cfg.solve.placeholder,(val,fb)=>{
      if(near(numOf(val),cfg.solve.expect))cfg.onSolved(helpers);
      else fb.innerHTML=`<span class="step-bad">${cfg.solve.hint||'回到方程再解。'}</span>`;
    });
    set(bundle(myEq,ar.root));cleanups.push(ar.destroy);
  }
  const helpers={
    set,el,
    hintUsed:()=>hintUsed,
    addCleanup(f){cleanups.push(f);},
    restart(){resetReveals();hintUsed=false;stageRelations(0);}
  };
  stageRelations(0);
  return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});clearNode(mount);}};
}

function navigate(h){
  const target=h.startsWith('#')?h:('#'+h);
  if(location.hash===target)applyHash();else location.hash=target;
}
function applyHash(){
  const p=(location.hash||'').replace('#','').split('/').filter(Boolean);
  const v=p[0]||'home';
  if(v==='home'){closeCard();show('home');}
  else if(v==='map'){const zone=p[1]||'basic';closeCard();renderMap(zone);show('map');}
  else if(v==='card'){const pid=p[1];if(CARDS[pid])openCard(pid,p[2]==='drill'?'drill':'main');}
}
window.addEventListener('hashchange',applyHash);

$('#mode-drill').onclick=()=>{if(curVariant!=='drill')navigate('/card/'+curCard+'/drill');};
function markDone(independent){
  const drill=curVariant==='drill';
  const s=drill?drillSet:doneSet;
  if(!s.has(curCard)){s.add(curCard);saveSet(drill?DRILL_KEY:DONE_KEY,s);}
  if(independent){const iset=drill?drillIndepSet:indepSet;
    if(!iset.has(curCard)){iset.add(curCard);saveSet(drill?DRILL_INDEP_KEY:INDEP_KEY,iset);}}
}

 name:'春游租车',
 stem:'同学春游。<b>租 45 座的车，有 15 人没座位</b>；改成<b>租 60 座的车，可以少租 1 辆，而且正好坐满</b>。45 座每辆租金 220 元，60 座每辆 300 元。一共多少人、原计划租几辆？怎样租车最省钱？',
 drill:{stem:'同学春游。<b>租 40 座的车，有 10 人没座位</b>；改成<b>租 50 座的车，可以少租 1 辆，而且正好坐满</b>。40 座每辆租金 200 元，50 座每辆 260 元。一共多少人、原计划租几辆？怎样租车最省钱？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{small:40,big:50,stand:10,n:6,people:250,sr:200,br:260,
       cands:[{s:7,b:0,cost:1400},{s:5,b:1,cost:1260},{s:0,b:5,cost:1300}],bestCost:1260}
     :{small:45,big:60,stand:15,n:5,people:240,sr:220,br:300,
       cands:[{s:6,b:0,cost:1320},{s:4,b:1,cost:1180},{s:0,b:4,cost:1200}],bestCost:1180};
   return equationFlow(stage,{
     relations:[
       {q:'换成大车以后，拉的还是原来这批同学吗？总人数会不会变？',
        tryCheck:s=>/不变|同一|一样|没变|相同|没增|没减/.test(s),tryHint:'只是换了车，同学没增也没减。',
        guide:BASIC_EQ.invariant.guide,chooseQ:'两种方案，总人数是什么关系？',
        choices:[
          {label:'总人数不变，算的是同一批人',correct:true},
          {label:'换大车，总人数变多',hint:'人没换，怎么会变多？'},
          {label:'换大车，总人数变少',hint:'人没换，怎么会变少？'}],
        eqId:'invariant'},
       {q:'两种方案都能算出总人数。把这两个算式摆成相等，怎么写？',
        tryCheck:s=>s.includes('=')&&/x|X/.test(s),tryHint:'左边写小车方案的总人数，右边写大车方案的，中间等号。',
        guide:'小车方案是座位上的人加站着的人；大车方案正好坐满。两边都是总人数，用等号连起来。',
        chooseQ:'哪一条等式对？',
        choices:[
          {label:`${D.small}x + ${D.stand} = ${D.big}(x − 1)`,correct:true},
          {label:`${D.small}x − ${D.stand} = ${D.big}(x − 1)`,hint:'站着的人是加上，不是减去。'},
          {label:`${D.small}x + ${D.stand} = ${D.big}(x + 1)`,hint:'大车少租 1 辆，是 x−1。'}],
        direct:{cat:'分配',name:'同一批人：两种算法总人数相等',formula:`${D.small}x + ${D.stand} = ${D.big}(x − 1)`}}
     ],
     steps:[
       {label:`小车方案总人数怎么写？（x 是原计划辆数，${D.stand} 人没座）`,
        expectExpr:`${D.small}*x+${D.stand}`,hint:'座位上的人加站着的人。',
        meaning:`总人数 = ${D.small}x + ${D.stand}`},
       {label:`大车方案总人数怎么写？（少租 1 辆，正好坐满）`,
        expectExpr:`${D.big}*(x-1)`,hint:'辆数是 x−1，乘每辆座位。',
        meaning:`总人数 = ${D.big}(x − 1)`}
     ],
     eq:{placeholder:`比如 ${D.small}x+${D.stand}=${D.big}(x−1)`,
       model:{xUnit:'辆',numUnits:{[D.small]:'人/辆',[D.big]:'人/辆',[D.stand]:'人'},
         palette:{人:'M',辆:'T'},varName:'x',
         hint:'座位上的人、站着的人都是“人”，等号两边对的都是总人数。'}},
     solve:{placeholder:'方程解出来，原计划租几辆？',expect:D.n,
       hint:'先去括号，再移项求 x。'},
     onSolved(h){
       showReveal('1',`x = ${D.n}（辆），总人数 ${D.people}`,
         `代回：${D.small}×${D.n}+${D.stand}=${D.people}，${D.big}×${D.n-1}=${D.people}，对得上。`);
       const wrap=el('div');wrap.style.width='100%';
       const tb=thinkBox('第二问：怎样租车最省钱？',D.cands.map(c=>({
         label:`${c.s} 辆${D.small}座 + ${c.b} 辆${D.big}座（${c.cost} 元）`,
         correct:c.cost===D.bestCost,hint:'把各车租金加起来再比大小。'})));
       tb.onPass=()=>{
         showReveal('2',`最省 ${D.bestCost} 元`,'这个方案座位够，租金在几个方案里最低。');
         markDone(!h.hintUsed());
         const b=el('button','btn go');b.type='button';b.textContent='再做一次';
         b.onclick=()=>h.restart();h.addCleanup(()=>b.onclick=null);h.set(b);
       };
       wrap.appendChild(tb.root);h.addCleanup(tb.destroy);h.set(wrap);
     }
   });
 }
},
box:{
 name:'每箱装多少',
 stem:'<b>5 台 A 机器</b>一天的产品，装满 8 箱还剩 4 个；<b>7 台 B 机器</b>一天的产品，装满 11 箱还剩 1 个。已知<b>每台 A 比每台 B 多产 1 个</b>。每箱装多少个？',
 drill:{stem:'<b>4 台 A 机器</b>一天的产品，装满 6 箱正好；<b>5 台 B 机器</b>一天的产品，装满 7 箱正好。已知<b>每台 A 比每台 B 多产 1 个</b>。每箱装多少个？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{mA:4,aBox:6,aRest:0,mB:5,bBox:7,bRest:0,x:10,A:15,B:14}
     :{mA:5,aBox:8,aRest:4,mB:7,bBox:11,bRest:1,x:12,A:20,B:19};
   const numU={};
   numU[D.aBox]='箱';numU[D.bBox]='箱';numU[D.mA]='台';numU[D.mB]='台';
   if(D.aRest&&D.aRest!==1)numU[D.aRest]='个';
   if(D.bRest&&D.bRest!==1&&D.bRest!==D.aRest)numU[D.bRest]='个';
   return equationFlow(stage,{
     relations:[
       {q:`${D.mA} 台 A 一天一共做了 ${D.aBox}x${D.aRest?`+${D.aRest}`:''} 个。那一台 A 做多少？这个数怎么算？`,
        tryCheck:s=>exprMatch(s,`(${D.aBox}*x+${D.aRest})/${D.mA}`),
        tryHint:'几台的总产量，平均分到每一台。',
        guide:'几台机器的总产量知道了，要平均分到每一台，用什么法？',
        chooseQ:'单台产量怎么求？',
        choices:[
          {label:'单台产量 = 总产量 ÷ 台数',correct:true},
          {label:'单台产量 = 总产量 × 台数',hint:'平均分，不是乘。'},
          {label:'单台产量 = 台数 ÷ 总产量',hint:'谁除以谁？总量分给若干台。'}],
        direct:{cat:'分配',name:'单台产量：总产量平均分到每台',formula:'单台产量 = 几台总产量 ÷ 台数'}},
       {q:'题目说每台 A 比每台 B 多产 1 个。单台 A 和单台 B 怎么相等？',
        tryCheck:s=>/1/.test(s)&&/=|A|B/.test(s),tryHint:'A 比 B 多 1，B 再加 1 就等于 A。',
        guide:'A 比 B 多 1 个。那 B 再添几个，就跟 A 一样多？',
        chooseQ:'哪条等式对？',
        choices:[
          {label:'单台 A = 单台 B + 1',correct:true},
          {label:'单台 A = 单台 B − 1',hint:'A 更多，应该 B 加 1。'},
          {label:'单台 A + 单台 B = 1',hint:'1 是它俩的差，不是和。'}],
        direct:{cat:'分配',name:'A 比 B 多产 1 个',formula:'单台 A = 单台 B + 1'}}
     ],
     steps:[
       {label:`单台 A 怎么写？（${D.mA} 台 A 的总产量平均分）`,
        expectExpr:`(${D.aBox}*x+${D.aRest})/${D.mA}`,hint:'总产量 ÷ 台数。',
        meaning:`单台 A =（${D.aBox}x${D.aRest?`+${D.aRest}`:''}）÷ ${D.mA}`},
       {label:`单台 B 怎么写？（${D.mB} 台 B 的总产量平均分）`,
        expectExpr:`(${D.bBox}*x+${D.bRest})/${D.mB}`,hint:'总产量 ÷ 台数。',
        meaning:`单台 B =（${D.bBox}x${D.bRest?`+${D.bRest}`:''}）÷ ${D.mB}`}
     ],
     eq:{placeholder:`比如（${D.aBox}x+${D.aRest}）/${D.mA}=（${D.bBox}x+${D.bRest}）/${D.mB}+1`,
       model:{xUnit:'个/箱',numUnits:numU,palette:{个:'L',箱:'T',台:'M'},varName:'x',
         hint:'两边算的都是一台机器一天做多少个，单位要对得上。'}},
     solve:{placeholder:'方程解出来，每箱装多少个？',expect:D.x,
       hint:'两边同乘消分母，去括号再移项。'},
     onSolved(h){
       showReveal('2',`x = ${D.x}（单台 A=${D.A}、单台 B=${D.B}）`,
         `代回：单台 A ${D.A}、单台 B ${D.B}，正好差 1。`);
       markDone(!h.hintUsed());
       const b=el('button','btn go');b.type='button';b.textContent='再做一次';
       b.onclick=()=>h.restart();h.addCleanup(()=>b.onclick=null);h.set(b);
     }
   });
 }
},
tunnel:{
 name:'挖隧道还要多久',
 stem:'挖一条长 <b>146 米</b>的隧道。前 3 天一共挖了 <b>26 米</b>（前 2 天只有甲，第 3 天起甲乙一起）。已知<b>甲每天比乙多挖 2 米</b>。照这样算，剩下的还要多少天？',
 drill:{stem:'挖一条长 <b>142 米</b>的隧道。前 3 天一共挖了 <b>22 米</b>（前 2 天只有甲，第 3 天起甲乙一起）。已知<b>甲每天比乙多挖 2 米</b>。照这样算，剩下的还要多少天？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{L:142,S:22,b:4,jia:6,remain:120,days:12}
     :{L:146,S:26,b:5,jia:7,remain:120,days:10};
   return equationFlow(stage,{
     relations:[
       {q:'题目说甲每天比乙多挖 2 米。用 x 表示乙每天挖多少，那甲每天挖多少？',
        tryCheck:s=>exprMatch(s,'x+2'),tryHint:'甲比乙多 2，乙是 x，甲就是 x 再添 2。',
        guide:'甲比乙多 2 米。乙是 x，甲比 x 多几，怎么写？',
        chooseQ:'甲每天挖多少？',
        choices:[
          {label:'甲每天 = x + 2',correct:true},
          {label:'甲每天 = x − 2',hint:'甲更多，应该加。'},
          {label:'甲每天 = 2x',hint:'是多 2 米，不是 2 倍。'}],
        direct:{cat:'工程',name:'甲比乙多挖 2 米',formula:'甲每天 = x + 2（x 是乙每天）'}},
       {q:'前 3 天里甲干了几天、乙干了几天？这几天的活儿接起来等于多少米？',
        tryCheck:s=>new RegExp(D.S).test(s)&&/甲|乙|天/.test(s),tryHint:'甲干 3 天、乙干 1 天，接起来是前 3 天的总米数。',
        guide:BASIC_EQ.workadd.guide,
        chooseQ:'前 3 天的活儿怎么接？',
        choices:[
          {label:`甲 3 天的 + 乙 1 天的 = ${D.S} 米`,correct:true},
          {label:`甲 3 天的 − 乙 1 天的 = ${D.S} 米`,hint:'几段活儿是加起来，不是减。'},
          {label:`甲 + 乙 = ${D.S}`,hint:'甲干了 3 天，要算 3 份。'}],
        eqId:'workadd'},
       {q:'知道剩下多少米、两人合挖每天多少米，还要几天怎么算？',
        tryCheck:s=>/天|除|÷/.test(s),tryHint:'剩下的米数，除以合挖每天的米数。',
        guide:BASIC_EQ.worktime.guide,
        chooseQ:'还要的天数怎么求？',
        choices:[
          {label:'还要天数 = 剩下米数 ÷ 合挖每天米数',correct:true},
          {label:'还要天数 = 剩下米数 × 合挖速度',hint:'平均分到每天，用除。'},
          {label:'还要天数 = 合挖速度 ÷ 剩下米数',hint:'谁除以谁？'}],
        eqId:'worktime'}
     ],
     steps:[
       {label:'甲干 3 天，一共挖多少？（用 x 写）',
        expectExpr:'3*(x+2)',hint:'甲每天 x+2，干 3 天就乘 3。',
        meaning:'甲 3 天 = 3(x+2)'},
       {label:'前 3 天的总米数，左边怎么写？',
        expectExpr:'3*(x+2)+x',hint:'甲 3 天的，加上乙 1 天的 x。',
        meaning:`左边 = 3(x+2) + x，等于 ${D.S}`}
     ],
     eq:{placeholder:`比如 3(x+2)+x=${D.S}`,
       model:{xUnit:'米/天',numUnits:{[D.S]:'米',3:'天'},
         palette:{米:'L',天:'T'},varName:'x',
         hint:'两边算的都是米，先把乙每天 x 求出来。'}},
     solve:{placeholder:'先解 x：乙每天挖多少米？',expect:D.b,
       hint:'去括号、合并同类项，再移项。'},
     onSolved(h){
       showReveal('1',`乙每天 ${D.b} 米、甲每天 ${D.jia} 米`,
         `代回：3×${D.jia}+${D.b}=${D.S}，对得上。`);
       const wrap=el('div');wrap.style.width='100%';
       const remain=D.L-D.S;
       const ar=answerRow(`剩 ${remain} 米，两人合挖每天 ${D.jia+D.b} 米，还要几天？`,(val,fb)=>{
         if(near(numOf(val),D.days)){
           showReveal('2',`剩 ${remain} ÷ ${D.jia+D.b} = ${D.days} 天`,
             `代回：${D.days} 天合挖 ${D.days*(D.jia+D.b)} 米，正好是剩下的。`);
           markDone(!h.hintUsed());
           const b=el('button','btn go');b.type='button';b.textContent='再做一次';
           b.onclick=()=>h.restart();h.addCleanup(()=>b.onclick=null);h.set(b);
         }else fb.innerHTML='<span class="step-bad">剩下米数 ÷ 合挖每天米数。</span>';
       });
       wrap.appendChild(ar.root);h.addCleanup(ar.destroy);h.set(wrap);
     }
   });
 }
},
save:{
 name:'定期的本金',
 stem:'一笔钱存银行三年定期，<b>年利率 2.2%（单利）</b>，到期<b>本金加利息一共 21320 元</b>。当初存进去的本金是多少？',
 drill:{stem:'一笔钱存两年定期，<b>年利率 3%（单利）</b>，到期<b>本金加利息一共 5300 元</b>。当初存进去的本金是多少？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{rate:0.03,years:2,goal:5300,P:5000}
     :{rate:0.022,years:3,goal:21320,P:20000};
   D.factor=1+D.rate*D.years;
   return equationFlow(stage,{
     relations:[
       {q:`一年的利息按什么算？${D.years} 年的利息又怎么算？`,
        tryCheck:s=>/本金|x/.test(s)&&/利率/.test(s)&&/年/.test(s),tryHint:'本金、年利率、年数三样乘起来。',
        guide:BASIC_EQ.interest.guide,chooseQ:'利息怎么求？',
        choices:[
          {label:'利息 = 本金 × 年利率 × 年数',correct:true},
          {label:'利息 = 本金 + 年利率',hint:'是乘，不是加。'},
          {label:'利息 = 本金 × 年数',hint:'漏了年利率。'}],
        eqId:'interest'},
       {q:'到期拿回来的钱，由哪两部分组成？',
        tryCheck:s=>/本金/.test(s)&&/利息/.test(s),tryHint:'自己存的本金，加上生出来的利息。',
        guide:BASIC_EQ.amount.guide,chooseQ:'本利和怎么求？',
        choices:[
          {label:'本利和 = 本金 + 利息',correct:true},
          {label:'本利和 = 本金 − 利息',hint:'钱变多，应该加。'},
          {label:'本利和 = 利息',hint:'还有自己原来的本金。'}],
        eqId:'amount'},
       {q:`题目说到期一共 ${D.goal} 元。这个数跟本利和公式怎么相等？`,
        tryCheck:s=>s.includes(String(D.goal))&&/=|本金|本利/.test(s),tryHint:`${D.goal} 就是本利和，放在等号一边。`,
        guide:`题目给的 ${D.goal} 就是本利和，把它代到等号右边，左边写本金加利息。`,
        chooseQ:'哪条等式对？',
        choices:[
          {label:`本金 + 利息 = ${D.goal}`,correct:true},
          {label:`本金 − 利息 = ${D.goal}`,hint:'本利和是加。'},
          {label:`本金 = ${D.goal}`,hint:'还要加利息才到期。'}],
        direct:{cat:'金钱',name:`到期本利和是 ${D.goal} 元`,formula:`本金 + 利息 = ${D.goal}`}}
     ],
     steps:[
       {label:`${D.years} 年的利息怎么用 x 写？（年利率 ${Math.round(D.rate*1000)/10}%，单利）`,
        expectExpr:`x*${D.rate}*${D.years}`,hint:'本金乘年利率，再乘年数。',
        meaning:`利息 = x × ${D.rate} × ${D.years}`},
       {label:'本利和怎么写？（本金加利息）',
        expectExpr:`${D.factor}*x`,hint:`提公因子 x，系数是 ${D.factor}。`,
        meaning:`本利和 = ${D.factor}x`}
     ],
     eq:{placeholder:`比如 ${D.factor}x=${D.goal}`,
       model:{xUnit:'元',numUnits:{[D.goal]:'元'},palette:{元:'M'},varName:'x',
         hint:'两边都是元，左边是本金加利息，右边是到期拿回来的钱。'}},
     solve:{placeholder:'方程解出来，本金是多少？',expect:D.P,
       hint:`x = ${D.goal} ÷ ${D.factor}。`},
     onSolved(h){
       showReveal('2',`x = ${D.P}，${Math.round(D.factor*1000)/1000}×${D.P} = ${D.goal}`,
         `代回：本金 ${D.P}，${D.years} 年利息 ${D.goal-D.P}，合计 ${D.goal}。`);
       markDone(!h.hintUsed());
       const b=el('button','btn go');b.type='button';b.textContent='再做一次';
       b.onclick=()=>h.restart();h.addCleanup(()=>b.onclick=null);h.set(b);
     }
   });
 }
},
work:{
 name:'甲乙合作要几天',
 stem:'一项工程，<b>甲单独做 20 天完成，乙单独做 30 天完成</b>。若甲先单独做 4 天，再由甲乙合作 x 天完成。先自己列方程，再求合作天数。',
 drill:{stem:'一项工程，<b>甲单独做 15 天完成，乙单独做 10 天完成</b>。若甲先单独做 3 天，再由甲乙合作 x 天完成。先自己列方程，再求合作天数。'},
 build(stage,variant){
   const D=variant==='drill'
     ?{adays:15,bdays:10,preDays:3,ag:4,bg:6,x:4.8,pre:12}
     :{adays:20,bdays:30,preDays:4,ag:3,bg:2,x:9.6,pre:12};
   const speed=D.ag+D.bg;
   return equationFlow(stage,{
     relations:[
       {q:`整项 60 格，甲单独 ${D.adays} 天做完。甲每天做几格？怎么算？`,
        tryCheck:s=>exprMatch(s,'60/'+D.adays)||near(numOf(s),D.ag),
        tryHint:'60 格平均分到甲的天数里。',
        guide:BASIC_EQ.workrate.guide,chooseQ:'甲每天的效率怎么求？',
        choices:[
          {label:`甲每天 = 60 ÷ ${D.adays} = ${D.ag} 格`,correct:true},
          {label:'甲每天 = 60 × 天数',hint:'平均分，用除。'},
          {label:'甲每天 = 天数 ÷ 60',hint:'谁除以谁？'}],
        eqId:'workrate'},
       {q:`乙单独 ${D.bdays} 天做完 60 格。乙每天做几格？`,
        tryCheck:s=>exprMatch(s,'60/'+D.bdays)||near(numOf(s),D.bg),
        tryHint:'同样，60 除以乙单独的天数。',
        guide:BASIC_EQ.workrate.guide,chooseQ:'乙每天的效率怎么求？',
        choices:[
          {label:`乙每天 = 60 ÷ ${D.bdays} = ${D.bg} 格`,correct:true},
          {label:'乙每天 = 60 × 天数',hint:'平均分，用除。'},
          {label:'乙每天 = 天数 ÷ 60',hint:'谁除以谁？'}],
        eqId:'workrate'},
       {q:'甲先做一段，再两人合作。这两段接起来跟整项什么关系？',
        tryCheck:s=>/60/.test(s)&&/=|加|先|合作/.test(s),tryHint:'先做的加合作做的，正好是整项 60 格。',
        guide:BASIC_EQ.workadd.guide,chooseQ:'两段活儿怎么接成整项？',
        choices:[

          {label:`奶片产量 − 酸奶产量 = ${D.total}`,hint:'是加。'},
          {label:`奶片产量 = ${D.total}`,hint:'还有酸奶。'}],
        direct:{cat:'工程',name:`${D.total} 吨全部处理完`,formula:`奶片产量 + 酸奶产量 = ${D.total}`}}
     ],
     steps:[
       {label:'奶片产量是多少？（每天 1 吨、x 天）',
        expectExpr:'x',hint:'1 乘 x。',meaning:'奶片产量 = x 吨'},
       {label:'酸奶天数是多少？',
        expectExpr:'4-x',hint:'4 减奶片天数。',meaning:'酸奶天数 = 4 − x'},
       {label:'酸奶产量是多少？（每天 3 吨）',
        expectExpr:'3*(4-x)',hint:'3 乘酸奶天数。',meaning:'酸奶产量 = 3(4−x) 吨'},
       {label:'两种产量加起来，左边怎么写？',
        expectExpr:'x+3*(4-x)',hint:'奶片加酸奶。',meaning:`左边 = x + 3(4−x)，等于 ${D.total}`}
     ],
     eq:{placeholder:`比如 x+3(4-x)=${D.total}`,
       model:{xUnit:'天',numUnits:{[D.total]:'吨',4:'天'},
         palette:{吨:'L',天:'T'},varName:'x',
         hint:'两边算的都是吨，先把奶片天数 x 求出来。'}},
     solve:{placeholder:'方程解出来，奶片做几天？',expect:D.x,
       hint:'去括号、合并，再移项。'},
     onSolved(h){
       showReveal('1',`奶片 ${D.x} 吨、酸奶 ${3*(4-D.x)} 吨，合计 ${D.total}`,
         `时间 ${D.x}+${4-D.x}=4，吨数也正好 ${D.total}。`);
       const p1=4*2000+(D.total-4)*500;
       const p2=D.x*2000+3*(4-D.x)*1200;
       const wrap=el('div');wrap.style.width='100%';
       const ar=answerRow('先算方案一利润：4 吨奶片、其余直卖，共多少？',(val,fb)=>{
         if(near(numOf(val),p1)){
           const w1=el('div');w1.style.width='100%';
           const ar2=answerRow('再算方案二利润：奶片、酸奶按吨数，共多少？',(v2,f2)=>{
             if(near(numOf(v2),p2)){
               const w2=el('div');w2.style.width='100%';
               const tb=thinkBox('两笔利润，选哪个？',[
                 {label:`方案二，多赚 ${p2-p1}`,correct:true},
                 {label:'方案一',hint:'比两个数谁大。'},
                 {label:'一样多',hint:'两个数差多少？'}]);
               tb.onPass=()=>{
                 showReveal('2',`方案二 ${p2} − 方案一 ${p1} = ${p2-p1}`,
                   '两笔都按吨数和单位利润复算，方案二更高。');
                 markDone(!h.hintUsed());
                 const b=el('button','btn go');b.type='button';b.textContent='再做一次';
                 b.onclick=()=>h.restart();h.addCleanup(()=>b.onclick=null);h.set(b);
               };
               w2.appendChild(tb.root);h.addCleanup(tb.destroy);h.set(w2);
             }else f2.innerHTML='<span class="step-bad">奶片2000、酸奶1200，按吨数乘。</span>';
           });
           w1.appendChild(ar2.root);h.addCleanup(ar2.destroy);h.set(w1);
         }else fb.innerHTML='<span class="step-bad">奶片2000/吨、直卖500/吨，再加。</span>';
       });
       wrap.appendChild(ar.root);h.addCleanup(ar.destroy);h.set(wrap);
     }
   });
 }
}
};

applyHash();
</script>
