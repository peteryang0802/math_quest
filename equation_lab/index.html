<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相等关系实验室 · 方程应用题</title>
<style>
:root{
  --bg:#F4F7FB;--card:#fff;--ink:#1E293B;--sub:#64748B;--line:#E2E8F0;
  --blue:#3B82F6;--teal:#14B8A6;--purple:#8B5CF6;--pink:#EC4899;--orange:#F59E0B;--green:#10B981;
  --green-bg:#A7F3D0;--shadow:0 4px 18px rgba(15,23,42,.07);--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5}
#app{max-width:1080px;margin:0 auto;min-height:100vh}
.view{display:none;animation:fade .45s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font-family:inherit}
/* 按钮 */
.btn{border:none;cursor:pointer;font-size:14px;font-weight:700;border-radius:12px;padding:11px 18px;
  background:#fff;color:var(--ink);border:2px solid var(--line);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green);font-size:15px;padding:13px 22px}
/* 首页 */
.hero{padding:40px 20px 30px;text-align:center}
.hero-badge{display:inline-block;background:#EFF6FF;color:var(--blue);font-weight:800;font-size:13px;
  padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(26px,5vw,38px);margin:16px 0 10px}
.lead{color:var(--sub);font-size:15px;max-width:620px;margin:0 auto}
.zone-row{display:flex;gap:18px;margin-top:30px;text-align:left}
.zone-card{flex:1;background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
  cursor:pointer;border:2px solid transparent;transition:.18s}
.zone-card:active{transform:scale(.98)}
.zone-card.basic{border-top:5px solid var(--blue)}
.zone-card.adv{border-top:5px solid var(--purple)}
.zone-tag{font-size:12px;font-weight:800;color:var(--sub)}
.zone-card h3{margin:8px 0 6px;font-size:19px}
.zone-card p{font-size:13.5px;color:var(--sub);margin:0 0 14px}
.pill{display:inline-block;background:#F1F5F9;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;margin-right:6px}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 18px;position:sticky;top:0;background:var(--bg);z-index:5}
.crumb{font-weight:800;font-size:17px}
/* 地图 */
.map-wrap{padding:6px 18px 40px}
.theme-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.theme-head{display:flex;align-items:center;gap:12px;padding:16px 20px;color:#fff}
.theme-head .dot{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800}
.theme-head h2{margin:0;font-size:17px}
.theme-head .tsub{font-size:12.5px;opacity:.9;font-weight:400}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px 20px 20px}
.tile{border:2px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;background:#fff;transition:.15s;text-align:left}
.tile:active{transform:scale(.97)}
.tile .no{font-size:11px;font-weight:800;color:var(--sub)}
.tile .nm{font-size:14px;font-weight:800;margin-top:4px}
.tile.done{border-color:var(--green)}
.tile.done .nm::after{content:" ✓";color:var(--green)}
/* 题卡 */
.card-wrap{padding:0 18px 46px}
.stem-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;
  border-left:6px solid var(--blue);font-size:15px}
.stem-box .qlabel{font-size:12px;font-weight:800;color:var(--blue);display:block;margin-bottom:6px}
.stage-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px;min-height:260px}
.stage-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
/* 揭示 */
.reveal{border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;color:#fff;display:none}
.reveal.show{display:block;animation:fade .4s}
.reveal.r1{background:linear-gradient(120deg,#3B82F6,#6366F1)}
.reveal.r2{background:linear-gradient(120deg,#059669,#10B981)}
.reveal .rtag{font-size:12px;font-weight:800;opacity:.85;display:block;margin-bottom:6px}
.reveal .formula{font-size:clamp(16px,3vw,21px);font-weight:800}
.reveal .note{font-size:13.5px;margin-top:8px;opacity:.95}
/* 通用场景元素 */
.act-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.svgicon{display:inline-block;vertical-align:middle}
.people-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.person-chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px}
.person-chip svg{width:32px;height:32px}
.person-chip .tag{font-size:10px;font-weight:800;color:var(--sub)}
/* 水平条 */
.hbar{display:flex;width:100%;height:52px;border-radius:12px;overflow:hidden;background:#EEF2F7;border:1px solid var(--line)}
.hseg{display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;transition:width .5s cubic-bezier(.22,1,.36,1)}
.haxis{display:flex;justify-content:space-between;width:100%;font-size:11px;color:var(--sub);margin-top:-8px}
/* 水槽 60 格 */
.tank{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;width:100%;max-width:660px}
.cell{aspect-ratio:1;border-radius:3px;background:#EDF1F6;border:1px solid #E2E8F0;transition:.3s}
.cell.a{background:var(--blue);border-color:var(--blue)}
.cell.b{background:var(--orange);border-color:var(--orange)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--sub);font-weight:700;flex-wrap:wrap;justify-content:center}
.dotleg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 跑道 */
.runway{width:100%;position:relative;height:170px;background:repeating-linear-gradient(90deg,#F4F7FB 0 40px,#E8EEF6 40px 42px);
  border-radius:12px;border:1px solid var(--line);overflow:hidden}
.runner{position:absolute;transition:left .5s linear;display:flex;flex-direction:column;align-items:center;gap:2px}
.runner .rname{font-size:11px;font-weight:800}
.horse{font-size:30px;line-height:1}
/* 两本账/利润柱 */
.cols{display:flex;gap:34px;align-items:flex-end;justify-content:center;height:230px;width:100%}
.pf{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.pf .pcol{width:84px;border-radius:12px 12px 6px 6px;display:flex;justify-content:center;align-items:flex-start;
  color:#fff;font-weight:800;font-size:14px;padding-top:8px;transition:height .7s cubic-bezier(.22,1,.36,1)}
.pf .plabel{font-size:12.5px;font-weight:800;color:var(--sub);text-align:center}
/* 时间轴 */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.day{background:#F1F5F9;border-radius:10px;padding:10px 8px;min-height:80px;font-size:11.5px;color:var(--sub)}
.day b{display:block;font-size:12px;color:var(--ink);margin-bottom:4px}
.day .task{background:#fff;border-radius:7px;padding:5px 7px;margin-top:5px;font-weight:700;font-size:11px}
/* 费用表 */
.fee-table{width:100%;border-collapse:collapse;font-size:13px}
.fee-table th,.fee-table td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.fee-table th{background:#F8FAFC;font-weight:800}
.fee-table .best{background:#ECFDF5;font-weight:800;color:#059669}
/* 输入框 */
.eq-input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:17px;font-weight:700;
  font-family:inherit;outline:none}
.eq-input:focus{border-color:var(--blue)}
.input-fb{font-size:13px;font-weight:700;min-height:20px}
/* 滑块 */
input[type=range]{width:100%;-webkit-appearance:none;height:10px;border-radius:999px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--blue);box-shadow:0 2px 8px rgba(59,130,246,.5);cursor:pointer;border:3px solid #fff}
.range-wrap{width:100%;display:flex;flex-direction:column;gap:8px}
.range-cap{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--sub)}
.range-val{font-size:22px;font-weight:800;color:var(--blue);text-align:center}
/* 托盘配对 */
.tray{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.tray-row{display:flex;gap:8px;align-items:center;justify-content:center;min-height:40px}
.slot{width:38px;height:38px;border-radius:9px;border:2px dashed #CBD5E1;display:grid;place-items:center;font-size:15px}
.slot.fill{border-style:solid}
.slot.ja{background:#DBEAFE;border-color:var(--blue)}
.slot.jb{background:#FFEDD5;border-color:var(--orange)}
.scrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px;font-size:12px;font-weight:800;color:var(--sub)}
@media (max-width:720px){
  .zone-row{flex-direction:column}
  .hero{padding:28px 16px}
  .cols{gap:18px}
  .pf .pcol{width:64px}
  .stage-box{padding:18px 14px}
}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="view-home">
    <div class="hero">
      <span class="hero-badge">相等关系实验室</span>
      <h1>动手做，看懂"相等"</h1>
      <p class="lead">每道题只做一个动作。先看见题目里的东西怎么变得相等，再把这一刻记成方程。不用背，照着做就懂。</p>
      <div class="zone-row">
        <div class="zone-card basic" data-zone="basic">
          <div class="zone-tag">第一块 · 先玩这里</div>
          <h3>基础室</h3>
          <p>同一批东西怎么分、几段怎么凑成整体。把"相等"的直觉先建立起来。</p>
          <span class="pill">2 个主题</span><span class="pill">8 张题卡</span>
        </div>
        <div class="zone-card adv" data-zone="adv">
          <div class="zone-tag">第二块 · 基础玩透再来</div>
          <h3>进阶室</h3>
          <p>追上去、配成套、两本账比一比。更绕，也更有意思。</p>
          <span class="pill">3 个主题</span><span class="pill">3 张题卡</span>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-map">
    <div class="topbar"><button class="btn" id="map-back">← 返回</button><div class="crumb" id="map-title"></div></div>
    <div class="map-wrap" id="map-wrap"></div>
  </section>

  <section class="view" id="view-card">
    <div class="topbar"><button class="btn" id="card-back">← 地图</button><div class="crumb" id="card-title"></div></div>
    <div class="card-wrap">
      <div class="stem-box"><span class="qlabel">完整题目</span><span id="stem-text"></span></div>
      <div class="stage-box"><div class="stage-inner" id="stage"></div></div>
      <div class="reveal r1" id="rev1"><span class="rtag">第一步 · 我看见关系了</span><div class="formula" id="rev1-f"></div><div class="note" id="rev1-n"></div></div>
      <div class="reveal r2" id="rev2"><span class="rtag">第二步 · 把答案代回图里核对</span><div class="formula" id="rev2-f"></span></div><div class="note" id="rev2-n"></div></div>
    </div>
  </section>
</div>

<script>
/* =========================================================
   通用工具
========================================================= */
const $=s=>document.querySelector(s);
const views={home:$('#view-home'),map:$('#view-map'),card:$('#view-card')};
function show(v){Object.values(views).forEach(x=>x.classList.remove('active'));views[v].classList.add('active');}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function clearNode(n){while(n.firstChild)n.removeChild(n.firstChild);}
const near=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
const r2=x=>Math.round(x*100)/100; // 仅用于显示，不参与判定
/* SVG 图标（可填色） */
const SVG={
 tree:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L18 9 H15 L20 15 H13 V22 H11 V15 H4 L9 9 H6 Z" fill="${c}"/></svg>`,
 coin:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="${c}"/><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">¥</text></svg>`,
 box:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M3 7 L12 3 L21 7 V18 L12 22 L3 18 Z" fill="${c}"/><path d="M3 7 L12 11 L21 7 M12 11 V22" stroke="#fff" stroke-width="1.3" fill="none"/></svg>`,
 person:c=>`<svg class="svgicon" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.4" fill="${c}"/><path d="M5 21 C5 15 8 13 12 13 C16 13 19 15 19 21 Z" fill="${c}"/></svg>`,
 gear:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="${c}"/><path fill="${c}" d="M11 2h2v3h-2zM11 19h2v3h-2zM2 11h3v2H2zM19 11h3v2h-2zM5 6.4l1.4-1.4 2.1 2.1-1.4 1.4zM15.5 16.9l1.4-1.4 2.1 2.1-1.4 1.4zM18.6 5l1.4 1.4-2.1 2.1-1.4-1.4zM8.5 15.5l-2.1 2.1L5 16.2l2.1-2.1z"/></svg>`,
 bottle:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><rect x="10" y="2" width="4" height="4" rx="1" fill="${c}"/><path d="M8 8 H16 V20 a2 2 0 0 1-2 2 H10 a2 2 0 0 1-2-2 Z" fill="${c}"/></svg>`
};
/* 揭示面板控制 */
function showReveal(which,formula,note){
  const box=$('#rev'+which);
  $('#rev'+which+'-f').innerHTML=formula;
  const n=$('#rev'+which+'-n');if(n)n.innerHTML=note||'';
  box.classList.add('show');
}
function resetReveals(){['1','2'].forEach(k=>$('#rev'+k).classList.remove('show'));}

/* =========================================================
   5 主题 / 11 题卡 数据
========================================================= */
const THEMES=[
 {id:'A',zone:'basic',color:'#3B82F6',name:'同一批东西，怎么分都不变',tsub:'两种安排，对齐的是同一批总量',
  cards:['tree','parts','bus','box','tunnel']},
 {id:'B',zone:'basic',color:'#14B8A6',name:'几段凑成一个整体',tsub:'部分接起来，正好等于整体',
  cards:['save','work','cart']},
 {id:'C',zone:'adv',color:'#8B5CF6',name:'追上去，就到同一位置',tsub:'追上那一刻，两人路程相等',
  cards:['chase']},
 {id:'D',zone:'adv',color:'#EC4899',name:'配成套，受短缺的一方限制',tsub:'完整套数由先用完的零件决定',
  cards:['match']},
 {id:'E',zone:'adv',color:'#F59E0B',name:'算清两本账，再比大小',tsub:'先满足约束，再比利润',
  cards:['milk']}
];
const DONE_KEY='equation-lab-done';
function loadDone(){try{return new Set(JSON.parse(localStorage.getItem(DONE_KEY))||[]);}catch{return new Set();}}
function saveDone(){try{localStorage.setItem(DONE_KEY,JSON.stringify([...doneSet]));}catch{}}
const doneSet=loadDone();
let curCard=null,sceneApi=null;

/* =========================================================
   场景接口：build(stage) 返回 {destroy}
========================================================= */
function openCard(pid){
  curCard=pid;const c=CARDS[pid];
  $('#card-title').textContent=c.name;
  $('#stem-text').innerHTML=c.stem;
  resetReveals();
  const stage=$('#stage');clearNode(stage);
  sceneApi=c.build(stage);
  show('card');
}
function closeCard(){if(sceneApi&&sceneApi.destroy){sceneApi.destroy();}sceneApi=null;}

/* 占位：CARDS 在后续脚本定义 */
let CARDS={};

/* =========================================================
   地图渲染
========================================================= */
function renderMap(zone){
  $('#map-title').textContent=zone==='basic'?'第一块 · 基础室':'第二块 · 进阶室';
  const wrap=$('#map-wrap');clearNode(wrap);
  THEMES.filter(t=>t.zone===zone).forEach(t=>{
    const block=el('div','theme-block');
    const head=el('div','theme-head');head.style.background=`linear-gradient(120deg,${t.color},${t.color}cc)`;
    head.innerHTML=`<div class="dot">${t.id}</div><div><h2>${t.name}</h2><div class="tsub">${t.tsub}</div></div>`;
    const grid=el('div','card-grid');
    t.cards.forEach((pid,i)=>{
      const tile=el('div','tile'+(doneSet.has(pid)?' done':''));
      tile.innerHTML=`<div class="no">${t.id}-${i+1}</div><div class="nm">${CARDS[pid].name}</div>`;
      tile.onclick=()=>openCard(pid);
      grid.appendChild(tile);
    });
    block.append(head,grid);wrap.appendChild(block);
  });
}

/* =========================================================
   路由
========================================================= */
let curZone='basic';
function navigate(h){if(location.hash===h)applyHash();else location.hash=h;}
function applyHash(){
  const p=(location.hash||'').replace('#','').split('/').filter(Boolean);
  const v=p[0]||'home';
  if(v==='home'){closeCard();show('home');}
  else if(v==='map'){curZone=p[1]||'basic';closeCard();renderMap(curZone);show('map');}
  else if(v==='card'){const pid=p[1];if(CARDS[pid])openCard(pid);}
}
window.addEventListener('hashchange',applyHash);
document.querySelectorAll('.zone-card').forEach(z=>z.onclick=()=>navigate('/map/'+z.dataset.zone));
$('#map-back').onclick=()=>navigate('/home');
$('#card-back').onclick=()=>{closeCard();navigate('/map/'+curZone);};

/* =========================================================
   场景实现（11 张独立题卡）
========================================================= */
/* 通用：完成标记 */
function markDone(){if(!doneSet.has(curCard)){doneSet.add(curCard);saveDone();}}

CARDS={
tree:{
 name:'几个人种树',
 stem:'一组人去种树。<b>每人种 5 棵，还剩 3 棵</b>；改成<b>每人种 6 棵，就还缺 4 棵</b>。问有多少人、一共多少棵树？',
 build(stage){
   let step=0;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const fig=el('div');fig.style.width='100%';
   const btn=el('button','btn go');
   function render(){
     clearNode(fig);
     if(step===0){
       fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;align-items:center">
         <div style="border:2px solid var(--line);border-radius:14px;padding:14px 18px;text-align:center">
           <div style="font-size:12px;font-weight:800;color:var(--blue);margin-bottom:8px">每个人手里（5 棵）</div>
           <div style="display:flex;gap:6px;justify-content:center">${SVG.tree('#3B82F6').repeat(5)}</div></div>
         <div style="font-size:13.5px;color:var(--sub)">分完以后，桌上还多出来 →</div>
         <div style="display:flex;gap:6px;align-items:center">${SVG.tree('#10B981').repeat(3)}
           <span style="font-weight:800;color:#059669;font-size:14px">实有 3 棵</span></div>
       </div>`;
       btn.textContent='给每人多分 1 棵';
     }else if(step===1){
       const empty='<span class="slot" style="width:34px;height:34px"></span>';
       fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;align-items:center;width:100%">
         <div style="border:2px solid var(--blue);border-radius:14px;padding:14px 18px;text-align:center;box-shadow:0 0 0 3px #DBEAFE">
           <div style="font-size:12px;font-weight:800;color:var(--blue);margin-bottom:8px">每个人想种 6 棵（要再拿 1 棵）</div>
           <div style="display:flex;gap:6px;justify-content:center">${SVG.tree('#3B82F6').repeat(5)}${SVG.tree('#60A5FA')}</div></div>
         <div style="font-size:13.5px;color:var(--sub)">每人多 1 棵，这些"多出来的树"从哪来？</div>
         <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">
           ${SVG.tree('#10B981').repeat(3)}${empty.repeat(4)}</div>
         <div style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800;flex-wrap:wrap;justify-content:center">
           <span style="color:#059669">桌上有 3 棵</span><span style="color:var(--sub)">＋</span><span style="color:#EF4444">还缺 4 棵</span>
           <span style="color:var(--ink)">＝ 7 棵，每人 1 棵 → 有 7 个人</span></div>
       </div>`;

work:{
 name:'甲乙合作要几天',
 stem:'一项工程，<b>甲单独做 4 天完成 12 格</b>，剩下的甲乙一起做。<b>合做时每天甲 3 格、乙 2 格</b>。全部共 60 格。剩下的还要几天？先自己列方程。',
 build(stage){
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   let cells='';
   for(let i=0;i<60;i++)cells+=`<div class="cell ${i<12?'a':''}"></div>`;
   const tank=el('div');tank.style.width='100%';
   tank.innerHTML=`<div class="tank">${cells}</div>
     <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--sub);margin-top:6px">
       <span>↑ 甲独做 4 天 = 12 格</span><span>剩下 48 格，两人合做 ↑</span></div>
     <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
       <span style="font-size:12px;font-weight:800;color:var(--sub)">合做一天：</span>
       <div class="cell b" style="position:static"></div><div class="cell b" style="position:static"></div><div class="cell b" style="position:static"></div>
       <div class="cell c" style="position:static"></div><div class="cell c" style="position:static"></div>
       <span style="font-size:12px;font-weight:800;color:#059669">= 5 格/天</span></div>`;
   const eq=el('input');eq.className='eq-input';eq.placeholder='先写方程，比如 12+5x=60';
   const fb=el('div');fb.style.minHeight='20px';fb.style.fontSize='12.5px';
   const btn=el('button','btn go');btn.textContent='核对我的方程';
   function parse(expr){
     if(!expr.includes('='))return{ok:false};
     const parts=expr.split('=');
     if(parts.length!==2)return{ok:false};
     const mk=s=>{
       let clean=s.replace(/[^0-9x+\-*/(). ]/g,'');
       clean=clean.replace(/(\d)(?=[x(])/g,'$1*').replace(/\)(?=[x(\d])/g,')*').replace(/x(?=[\d(])/g,'x*');
       try{const fn=Function('x','return ('+clean+')');fn(1);return fn;}catch(e){return null;}
     };
     const fl=mk(parts[0]),fr=mk(parts[1]);
     if(!fl||!fr)return{ok:false};
     if(!near(fl(9.6),fr(9.6)))return{ok:false};
     if(near(fl(2),fr(2))&&near(fl(0),fr(0)))return{identity:true};
     return{ok:true};
   }
   btn.onclick=()=>{
     const r=parse(eq.value);
     if(r.ok){
       showReveal('1','你列的方程对：合做部分 = 60−12 = 48 格','合做每天 5 格，所以 5x = 48，你写的式子和它等价。');
       showReveal('2','x = 9.6 天，12+5×9.6 = 60','代回：合做 9.6 天完成 48 格，加甲独做 12 格，正好 60。');
       markDone();fb.textContent='';
     }else if(r.identity){
       fb.innerHTML='<span style="color:#EF4444;font-weight:800">这个式子两边永远相等，没把 x 约束住，重新写一个能解出天数的方程。</span>';
     }else{
       fb.innerHTML='<span style="color:#EF4444;font-weight:800">合做那段：甲 3 格 + 乙 2 格 = 每天 5 格。方程里有没有乙的 2 格？</span>';
     }
   };
   wrap.append(tank,eq,fb,btn);stage.appendChild(wrap);
   return{destroy(){btn.onclick=null;}};
 }
},

     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;width:100%">
       <div><div style="font-size:11.5px;font-weight:800;color:#059669;margin-bottom:6px">已配对（往返，每人 2 条记录）</div>
         <div style="display:flex;gap:7px;flex-wrap:wrap;min-height:36px">${pairedHtml||'<span style="font-size:12px;color:var(--sub)">还没配对</span>'}</div></div>
       <div><div style="font-size:11.5px;font-weight:800;color:var(--blue);margin-bottom:6px">未配对的去程（单程 20 元）· ${goLeft} 条</div>
         <div style="display:flex;gap:6px;flex-wrap:wrap">${goHtml}</div></div>
       <div><div style="font-size:11.5px;font-weight:800;color:#D97706;margin-bottom:6px">等待配对的回程 · ${backLeft} 条</div>
         <div style="display:flex;gap:6px;flex-wrap:wrap">${backHtml||'<span style="font-size:12px;color:var(--sub)">都配完了</span>'}</div></div>
     </div>`;
     const fee=30*paired+20*goLeft;
     money.textContent=paired===9?`配完：9 往返 + 7 单程 = 16 人，票款 410 元`:`当前票款 ${fee} 元（全按单程本应 500 元）`;
     btn.textContent=paired<9?'把同一人的去程、回程配成一对':'再玩一次';
   }
   btn.onclick=()=>{
     if(paired<9){paired++;render();}
     if(paired===9){
       showReveal('1','配成一对 = 同一个人：两条记录合为 1 个往返','9 对往返（每人去+回），剩下 7 条去程是单程，共 9+7=16 人。');
       showReveal('2','30×9 + 20×7 = 410 元','全按单程是 25×20=500；9 人各省 10 元，500−90=410。');
       markDone();
     }else if(paired===0){resetReveals();}
   };
   const dbl=el('button','btn ghost');dbl.textContent='一次配完';
   dbl.onclick=()=>{paired=9;render();btn.click();};
   const row=el('div');row.style.display='flex';row.style.gap='10px';row.append(btn,dbl);
   wrap.append(fig,money,row);stage.appendChild(wrap);render();
   return{destroy(){btn.onclick=null;dbl.onclick=null;}};
 }
},
chase:{
 name:'良马追驽马',
 stem:'<b>驽马先出发 12 天，每天走 150 里</b>；<b>良马每天走 240 里</b>，随后出发去追。推动两匹马共用的时间尺，看它们什么时候并排。',
 build(stage){
   let d=0;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=0;rng.max=24;rng.step=1;rng.value=0;
   const cap=el('div','range-cap');cap.innerHTML='<span>出发</span><span class="range-val" style="font-size:18px">良马走了 <b id="dv">0</b> 天</span><span>24 天</span>';
   const runway=el('div');runway.className='runway';
   const info=el('div');info.style.fontSize='13px';info.style.fontWeight='800';info.style.textAlign='center';
   const stepBtn=el('button','btn go');stepBtn.textContent='前进一天';
   const max=6000;
   const pos=mile=>4+(mile/max)*92;
   function horse(left,color,ch,label,top){
     return `<div class="runner" style="left:${left}%;top:${top}px;transform:translateX(-50%)">
       <div style="width:36px;height:36px;border-radius:50%;background:${color};display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.18)">${ch}</div>
       <div class="rname" style="color:${color}">${label}</div></div>`;
   }
   function render(){
     const good=240*d,slow=150*(d+12),gap=slow-good;
     const meet=near(gap,0),lg=pos(good),ls=pos(slow);
     $('#dv').textContent=d;
     const line=meet?`<div style="position:absolute;left:${lg}%;top:10px;bottom:8px;width:2px;background:#10B981;transform:translateX(-50%);opacity:.55"></div>`:'';
     runway.innerHTML=line
       +horse(lg,'#3B82F6','良',good+' 里',meet?16:24)
       +horse(ls,'#F59E0B','驽',slow+' 里',meet?84:24);
     info.innerHTML=near(gap,0)?'<span style="color:#059669">并排了！良马 20 天、驽马 32 天，都在 4800 里处</span>':
       `驽马还领先 <b style="color:#D97706">${r2(gap)}</b> 里（每天差距缩短 90 里）`;
     stepBtn.textContent=d<24?'前进一天':'回到起点';
   }
   function check(){
     if(near(240*d,150*(d+12))){
       showReveal('1','并排时路程相等：240x = 150(x+12)','也可以看成 90x = 1800：初始领先 1800，每天缩 90。');
       showReveal('2','x = 20，240×20 = 150×32 = 4800','代回：良马 20 天、驽马含先跑共 32 天，位置相同。');
       markDone();
     }else{resetReveals();}
   }
   rng.oninput=()=>{d=+rng.value;render();check();};
   stepBtn.onclick=()=>{d=d<24?d+1:0;rng.value=d;render();check();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,runway,info,stepBtn);stage.appendChild(wrap);render();
   return{destroy(){rng.oninput=null;stepBtn.onclick=null;}};
 }
},
match:{
 name:'车间配套最多几套',
 stem:'一个成品要 <b>4 个甲零件、3 个乙零件</b>配成一套。甲组每人每天做 6 个甲，乙组每人每天做 8 个乙，<b>两组共 50 人</b>。调工人换组，看怎么安排能做最多套。',
 build(stage){
   let ja=30;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=25;rng.max=38;rng.step=1;rng.value=ja;
   const cap=el('div','range-cap');cap.innerHTML='<span>25 人</span><span class="range-val" style="font-size:18px">甲组 <b id="mv">30</b> 人 · 乙组 <b id="mv2">20</b> 人</span><span>38 人</span>';
   const fig=el('div');fig.style.width='100%';
   const btn=el('button','btn go');
   function render(){
     const jb=50-ja;
     const aSets=Math.floor(6*ja/4),bSets=Math.floor(8*jb/3);
     const sets=Math.min(aSets,bSets);
     const aScrap=6*ja-4*sets,bScrap=8*jb-3*sets;
     const shortA=aSets<bSets,shortB=bSets<aSets;
     $('#mv').textContent=ja;$('#mv2').textContent=jb;
     let traySlots='';
     for(let i=0;i<4;i++)traySlots+=`<div class="slot fill ja" style="width:32px;height:32px">甲</div>`;
     for(let i=0;i<3;i++)traySlots+=`<div class="slot fill jb" style="width:32px;height:32px">乙</div>`;
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;width:100%;align-items:center">
       <div style="font-size:12px;font-weight:800;color:var(--sub)">一套成品的结构</div>
       <div class="tray-row">${traySlots}</div>
       <div style="display:flex;gap:26px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:800">
         <span style="color:${shortA?'#DC2626':'var(--blue)'}">甲能配 ${aSets} 套${shortA?'（短缺）':''}</span>
         <span style="color:${shortB?'#DC2626':'var(--orange)'}">乙能配 ${bSets} 套${shortB?'（短缺）':''}</span></div>
       <div style="font-size:30px;font-weight:900;color:${aScrap+bScrap===0?'#059669':'var(--ink)'}">完整 ${sets} 套</div>
       <div class="scrap">余料：甲剩 ${aScrap} 个、乙剩 ${bScrap} 个${aScrap+bScrap===0?' · 刚好用完，无余料':''}</div>
     </div>`;
     btn.textContent=ja>25?'调一名工人换组（甲组减1）':'调回甲组';
   }
   function check(){
     if(ja===32){
       showReveal('1','6×32/4 = 48，8×18/3 = 48，两边相等','短缺的一方决定完整套数；两边恰好相等时没有余料，套数最多。');
       showReveal('2','32 人做甲、18 人做乙，最多 48 套','对比：甲组 31 人 46 套、33 人 45 套，都比 48 少。');
       markDone();
     }else{resetReveals();}
   }
   rng.oninput=()=>{ja=+rng.value;render();check();};
   btn.onclick=()=>{ja=ja>25?ja-1:32;rng.value=ja;render();check();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig,btn);stage.appendChild(wrap);render();
   return{destroy(){rng.oninput=null;btn.onclick=null;}};
 }
},
milk:{
 name:'牛奶加工怎么选',
 stem:'收了 <b>9 吨牛奶，要在 4 天内加工完</b>。做奶片每天处理 1 吨，做酸奶每天处理 3 吨。移动时间分界，找到刚好处理完 9 吨的安排，再比两本账。',
 build(stage){
   let t=2;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=0.5;rng.max=3.5;rng.step=0.5;rng.value=t;
   const cap=el('div','range-cap');cap.innerHTML='<span>0.5 天</span><span class="range-val" style="font-size:18px">奶片做 <b id="tv">2</b> 天</span><span>3.5 天</span>';
   const fig=el('div');fig.style.width='100%';
   function render(){
     const chipT=t,yogDays=4-t,yogT=3*yogDays,total=chipT+yogT;
     const ok=near(total,9);
     $('#tv').textContent=r2(t);
     const wChip=t/4*100,wYog=yogDays/4*100;
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;width:100%">
       <div><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">4 天时间分界</div>
         <div class="hbar"><div class="hseg" style="width:${wChip}%;background:#3B82F6">奶片 ${r2(t)} 天</div>
         <div class="hseg" style="width:${wYog}%;background:#F59E0B">酸奶 ${r2(yogDays)} 天</div></div></div>
       <div style="font-size:13.5px;font-weight:800;text-align:center;color:${ok?'#059669':'#DC2626'}">
         奶片 ${r2(chipT)} 吨 + 酸奶 ${r2(yogT)} 吨 = ${r2(total)} 吨 ${ok?'✓ 正好 9 吨':'（不是 9 吨）'}</div>
       ${ok?`<div class="cols">
         <div class="pf"><div class="pcol" style="height:${10500/12000*180}px;background:#94A3B8">10500</div>
           <div class="plabel">方案一<br>4 奶片 + 5 直卖</div></div>
         <div class="pf"><div class="pcol" style="height:180px;background:#10B981">12000</div>
           <div class="plabel">方案二<br>1.5 奶片 + 7.5 酸奶</div></div>
       </div><div style="text-align:center;font-weight:800;color:#059669;font-size:13.5px">方案二多赚 1500 元，选方案二</div>`:
       `<div style="text-align:center;font-size:13px;color:var(--sub)">这样安排处理不完 9 吨，把分界调到 1.5 天奶片试试</div>`}
     </div>`;
     if(ok){
       showReveal('1','奶片 1.5 吨 + 酸奶 7.5 吨 = 9 吨，时间 1.5+2.5 = 4 天','先满足 9 吨、4 天这两个硬条件，方案才成立。');
       showReveal('2','方案二 12000 − 方案一 10500 = 1500','两本账都算清，方案二利润更高，选方案二。');
       markDone();
     }else{resetReveals();}
   }
   rng.oninput=()=>{t=+rng.value;render();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig);stage.appendChild(wrap);render();
   return{destroy(){rng.oninput=null;}};
 }
}
};

applyHash();
</script>
</body>
</html>
