<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相等关系实验室 · 方程应用题</title>
<style>
:root{
  --bg:#F4F7FB;--card:#fff;--ink:#1E293B;--sub:#64748B;--line:#E2E8F0;
  --blue:#3B82F6;--teal:#14B8A6;--purple:#8B5CF6;--pink:#EC4899;--orange:#F59E0B;--green:#10B981;
  --red:#EF4444;--shadow:0 4px 18px rgba(15,23,42,.07);--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5}
#app{min-height:100vh}
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font-family:inherit}
:focus-visible{outline:3px solid #6366F1;outline-offset:2px;border-radius:8px}
/* 通用按钮 */
.btn{border:none;cursor:pointer;font-size:14px;font-weight:700;border-radius:12px;padding:11px 18px;
  background:#fff;color:var(--ink);border:2px solid var(--line);transition:.15s;min-height:44px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green);font-size:15px;padding:13px 22px}
.btn.ghost{background:#F1F5F9}
/* 首页 */
.hero{padding:38px 20px 30px;text-align:center;max-width:1080px;margin:0 auto}
.hero-badge{display:inline-block;background:#EFF6FF;color:var(--blue);font-weight:800;font-size:13px;
  padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(26px,5vw,38px);margin:16px 0 10px}
.lead{color:var(--sub);font-size:15px;max-width:620px;margin:0 auto}
.zone-row{display:flex;gap:18px;margin-top:30px;text-align:left}
.zone-card{flex:1;background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
  cursor:pointer;border:2px solid transparent;width:100%;text-align:left}
.zone-card.basic{border-top:5px solid var(--blue)}
.zone-card.adv{border-top:5px solid var(--purple)}
.zone-tag{font-size:12px;font-weight:800;color:var(--sub)}
.zone-card h3{margin:8px 0 6px;font-size:19px}
.zone-card p{font-size:13.5px;color:var(--sub);margin:0 0 14px}
.pill{display:inline-block;background:#F1F5F9;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;margin-right:6px}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 18px;position:sticky;top:0;background:var(--bg);z-index:5}
.crumb{font-weight:800;font-size:17px}
/* 地图 */
.map-wrap{padding:6px 18px 40px;max-width:1080px;margin:0 auto}
.theme-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.theme-head{display:flex;align-items:center;gap:12px;padding:16px 20px;color:#fff}
.theme-head .dot{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800}
.theme-head h2{margin:0;font-size:17px}
.theme-head .tsub{font-size:12.5px;opacity:.9;font-weight:400}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px 20px 20px}
.tile{border:2px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;background:#fff;
  transition:.15s;text-align:left;min-height:44px}
.tile .no{font-size:11px;font-weight:800;color:var(--sub)}
.tile .nm{font-size:14px;font-weight:800;margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .st{font-size:11px;font-weight:800;display:flex;gap:5px}
.tile .st i{font-style:normal;color:var(--sub)}
.tile .st i.on{color:var(--green)}
/* 题卡左右布局 */
.card-shell{display:grid;grid-template-columns:1fr;max-width:1080px;margin:0 auto}
.card-rail{display:none}
.card-main{min-width:0}
.card-scroll{padding:0 18px 46px}
.stem-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;
  border-left:6px solid var(--blue);font-size:15px}
.stem-box .qlabel{font-size:12px;font-weight:800;color:var(--blue);display:block;margin-bottom:6px}
.stage-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px;min-height:240px}
.stage-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
/* 模式切换 */
.mode-tabs{display:flex;gap:8px;margin-left:auto}
.mode-tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;
  font-weight:800;color:var(--sub);cursor:pointer;min-height:38px}
.mode-tab.active{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
/* 想一想 */
.think{width:100%;border:2px dashed #C7D2FE;border-radius:14px;padding:14px 16px;background:#F8FAFF}
.think-q{font-size:14px;font-weight:800;color:#3730A3;margin-bottom:10px}
.think-row{display:flex;gap:10px;flex-wrap:wrap}
.think-opt{background:#fff;border:2px solid #C7D2FE;color:#3730A3;padding:9px 14px;min-height:42px;font-size:13.5px}
.think-fb{font-size:13px;font-weight:700;margin-top:10px;min-height:20px}
.think-bad{color:var(--red)}
.think-ok{color:#059669}
/* 揭示 */
.reveal{border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;color:#fff;display:none}
.reveal.show{display:block;animation:fade .4s}
.reveal.r1{background:linear-gradient(120deg,#3B82F6,#6366F1)}
.reveal.r2{background:linear-gradient(120deg,#059669,#10B981)}
.reveal .rtag{font-size:12px;font-weight:800;opacity:.85;display:block;margin-bottom:6px}
.reveal .formula{font-size:clamp(16px,3vw,21px);font-weight:800}
.reveal .note{font-size:13.5px;margin-top:8px;opacity:.95}
/* 通用场景元素 */
.act-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.svgicon{display:inline-block;vertical-align:middle}
.people-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* 水平条 */
.hbar{display:flex;width:100%;height:52px;border-radius:12px;overflow:hidden;background:#EEF2F7;border:1px solid var(--line)}
.hseg{display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;transition:width .5s cubic-bezier(.22,1,.36,1)}
.hseg.ghost-seg{background:#FCD34D;color:#92400E;border:2px dashed #F59E0B}
/* 水槽 */
.tank{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;width:100%;max-width:660px}
.cell{aspect-ratio:1;border-radius:3px;background:#EDF1F6;border:1px solid #E2E8F0;transition:.3s}
.cell.a{background:var(--blue);border-color:var(--blue)}
.cell.b{background:var(--orange);border-color:var(--orange)}
.cell.c{background:var(--teal);border-color:var(--teal)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--sub);font-weight:700;flex-wrap:wrap;justify-content:center}
.dotleg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 跑道 */
.runway{width:100%;position:relative;height:170px;background:repeating-linear-gradient(90deg,#F4F7FB 0 40px,#E8EEF6 40px 42px);
  border-radius:12px;border:1px solid var(--line);overflow:hidden}
.runner{position:absolute;transition:left .5s linear;display:flex;flex-direction:column;align-items:center;gap:2px}
.runner .rname{font-size:11px;font-weight:800}
/* 两本账 */
.cols{display:flex;gap:34px;align-items:flex-end;justify-content:center;height:230px;width:100%}
.pf{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.pf .pcol{width:84px;border-radius:12px 12px 6px 6px;display:flex;justify-content:center;align-items:flex-start;
  color:#fff;font-weight:800;font-size:14px;padding-top:8px;transition:height .7s cubic-bezier(.22,1,.36,1)}
.pf .plabel{font-size:12.5px;font-weight:800;color:var(--sub);text-align:center}
/* 时间轴 */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.day{background:#F1F5F9;border-radius:10px;padding:10px 8px;min-height:80px;font-size:11.5px;color:var(--sub)}
.day b{display:block;font-size:12px;color:var(--ink);margin-bottom:4px}
.day .task{background:#fff;border-radius:7px;padding:5px 7px;margin-top:5px;font-weight:700;font-size:11px}
/* 费用表 */
.fee-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.fee-table th,.fee-table td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.fee-table th{background:#F8FAFC;font-weight:800}
.fee-table .best{background:#ECFDF5;font-weight:800;color:#059669}
/* 输入框 */
.eq-input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:17px;font-weight:700;
  font-family:inherit;outline:none;min-height:48px}
.eq-input:focus{border-color:var(--blue)}
.input-fb{font-size:13px;font-weight:700;min-height:20px}
.answer-row{display:flex;flex-direction:column;gap:10px;width:100%;align-items:stretch}
/* 单位检查卡片 */
.unit-card{border:2px solid #FECACA;border-radius:14px;background:#FFF7F7;padding:14px 16px;margin-top:4px}
.unit-title{font-size:12.5px;font-weight:800;color:#B91C1C;margin-bottom:10px}
.unit-eq{font-size:15px;font-weight:800;line-height:2.1;word-break:break-word;color:var(--ink)}
.ut{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:1px 7px;margin:0 2px;white-space:nowrap}
.ut-L{background:#DBEAFE;color:#1D4ED8}
.ut-T{background:#FEF3C7;color:#B45309}
.ut-LT{background:#EDE9FE;color:#6D28D9}
.ut-M{background:#D1FAE5;color:#047857}
.ut-unk{background:#F1F5F9;color:#64748B}
.ut-res{border:1.5px solid currentColor;margin-left:6px}
.clash-op{color:#fff;background:var(--red);border-radius:7px;padding:1px 9px;font-weight:900}
.unit-note{font-size:13.5px;font-weight:800;color:var(--red);margin-top:10px}
.unit-hint{font-size:13px;font-weight:700;color:#3730A3;background:#EEF2FF;border-radius:10px;padding:9px 12px;margin-top:8px;line-height:1.6}
.unit-fix{margin-top:12px;background:#fff;border-color:var(--red);color:var(--red);min-height:42px;padding:9px 18px}
/* 滑块 */
input[type=range]{width:100%;-webkit-appearance:none;height:10px;border-radius:999px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--blue);box-shadow:0 2px 8px rgba(59,130,246,.5);cursor:pointer;border:3px solid #fff}
.range-wrap{width:100%;display:flex;flex-direction:column;gap:8px}
.range-cap{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--sub);gap:8px}
.range-val{font-size:22px;font-weight:800;color:var(--blue);text-align:center}
/* 托盘 */
.tray{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.tray-row{display:flex;gap:8px;align-items:center;justify-content:center;min-height:40px;flex-wrap:wrap}
.slot{width:38px;height:38px;border-radius:9px;border:2px dashed #CBD5E1;display:grid;place-items:center;
  font-size:15px;background:#fff}
.slot.fill{border-style:solid}
.slot.ja{background:#DBEAFE;border-color:var(--blue)}
.slot.jb{background:#FFEDD5;border-color:var(--orange)}
.scrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px;font-size:12px;font-weight:800;color:var(--sub)}
/* 左侧只读进度 */
.rail-head{font-size:12px;font-weight:800;color:var(--sub);padding:0 8px 10px}
.rail-list{display:flex;flex-direction:column;gap:6px}
.rail-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:11px;padding:9px 11px;cursor:pointer;min-height:42px}
.rail-item.current{border-color:#6366F1;background:#EEF2FF}
.rail-item .rn{flex:1;font-size:13px;font-weight:700}
.rail-item .rs{font-size:11px;font-weight:800;display:flex;gap:4px}
.rail-item .rs i{font-style:normal;color:#CBD5E1}
.rail-item .rs i.on{color:var(--green)}
.rail-back{width:100%;margin-top:10px}
@media (min-width:980px){
  .card-shell{grid-template-columns:264px 1fr;gap:24px;padding:0 24px}
  .card-rail{display:block;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:20px 0}
  .card-topbar{padding:16px 0}
}
@media (max-width:720px){
  .zone-row{flex-direction:column}
  .cols{gap:18px}
  .pf .pcol{width:64px}
  .stage-box{padding:18px 14px}
}
</style>
</head>
<body>
<div id="app">
  <!-- ===== 视图：首页 ===== -->
  <section class="view" id="view-home">
    <div class="hero">
      <span class="hero-badge">相等关系实验室</span>
      <h1>动手做，看懂“相等”</h1>
      <p class="lead">每道题只做一个动作。先看见题目里的东西怎么变得相等，再把这一刻记成方程。做完还有一道换题，自己试。</p>
      <div class="zone-row">
        <button class="zone-card basic" data-zone="basic" type="button">
          <div class="zone-tag">第一块 · 先玩这里</div>
          <h3>基础室</h3>
          <p>同一批东西怎么分、几段怎么凑成整体。</p>
          <span class="pill">2 个主题</span><span class="pill">8 张题卡</span>
        </button>
        <button class="zone-card adv" data-zone="adv" type="button">
          <div class="zone-tag">第二块 · 基础玩透再来</div>
          <h3>进阶室</h3>
          <p>追上去、配成套、两本账比一比。</p>
          <span class="pill">3 个主题</span><span class="pill">3 张题卡</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== 视图：地图 ===== -->
  <section class="view" id="view-map">
    <div class="topbar"><button class="btn" id="map-back" type="button">← 返回首页</button><div class="crumb" id="map-title"></div></div>
    <div class="map-wrap" id="map-wrap"></div>
  </section>

  <!-- ===== 视图：题卡 ===== -->
  <section class="view" id="view-card">
    <div class="card-shell">
      <aside class="card-rail" id="card-rail"></aside>
      <main class="card-main">
        <div class="topbar card-topbar">
          <button class="btn" id="card-back" type="button">← 地图</button>
          <div class="crumb" id="card-title"></div>
          <div class="mode-tabs" role="group" aria-label="学习模式">
            <button class="mode-tab active" id="mode-main" type="button">演示学习</button>
            <button class="mode-tab" id="mode-drill" type="button">独立换题</button>
          </div>
        </div>
        <div class="card-scroll">
          <div class="stem-box"><span class="qlabel">完整题目</span><span id="stem-text"></span></div>
          <div class="stage-box"><div class="stage-inner" id="stage"></div></div>
          <div class="reveal r1" id="rev1"><span class="rtag">第一步 · 我看见关系了</span><div class="formula" id="rev1-f"></div><div class="note" id="rev1-n"></div></div>
          <div class="reveal r2" id="rev2"><span class="rtag">第二步 · 把答案代回图里核对</span><div class="formula" id="rev2-f"></div><div class="note" id="rev2-n"></div></div>
        </div>
      </main>
    </div>
  </section>
</div>

<script>
/* =========================================================
   通用工具
========================================================= */
const $=s=>document.querySelector(s);
const views={home:$('#view-home'),map:$('#view-map'),card:$('#view-card')};
function show(v){Object.values(views).forEach(x=>x.classList.remove('active'));views[v].classList.add('active');}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function clearNode(n){while(n.firstChild)n.removeChild(n.firstChild);}
const near=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
const r2=x=>Math.round(x*100)/100; // 仅用于显示，不参与判定
function toHalfWidth(s){return (s||'').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ');}
function numOf(s){if(s==null)return null;const n=parseFloat(toHalfWidth(s).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
/* SVG 图标 */
const SVG={
 tree:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L18 9 H15 L20 15 H13 V22 H11 V15 H4 L9 9 H6 Z" fill="${c}"/></svg>`,
 book:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M5 3 H16 a2 2 0 0 1 2 2 V21 H6 a2 2 0 0 1-2-2 Z" fill="${c}"/><path d="M9 7 H14 M9 11 H14" stroke="#fff" stroke-width="1.5"/></svg>`,
 coin:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="${c}"/><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">¥</text></svg>`,
 box:c=>`<svg class="svgicon" width="22" height="22" viewBox="0 0 24 24"><path d="M3 7 L12 3 L21 7 V18 L12 22 L3 18 Z" fill="${c}"/><path d="M3 7 L12 11 L21 7 M12 11 V22" stroke="#fff" stroke-width="1.3" fill="none"/></svg>`,
 person:c=>`<svg class="svgicon" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.4" fill="${c}"/><path d="M5 21 C5 15 8 13 12 13 C16 13 19 15 19 21 Z" fill="${c}"/></svg>`
};
/* 揭示面板 */
function showReveal(which,formula,note){
  const box=$('#rev'+which);
  $('#rev'+which+'-f').innerHTML=formula;
  const n=$('#rev'+which+'-n');if(n)n.innerHTML=note||'';
  box.classList.add('show');
}
function resetReveals(){['1','2'].forEach(k=>$('#rev'+k).classList.remove('show'));}
/* 想一想：判断问题，答错给线索，答对才放行 */
function thinkBox(question,options){
  const root=el('div','think');
  const q=el('div','think-q',question);
  const row=el('div','think-row');
  const fb=el('div','think-fb');
  let answered=false;const api={root,onPass:null};
  options.forEach(o=>{
    const b=el('button','btn think-opt');b.type='button';b.textContent=o.label;
    b.onclick=()=>{
      if(answered)return;
      if(o.correct){answered=true;fb.innerHTML='<span class="think-ok">对，看下一步</span>';
        row.querySelectorAll('button').forEach(x=>x.disabled=true);if(api.onPass)api.onPass();}
      else fb.innerHTML='<span class="think-bad">再想想。'+(o.hint||'')+'</span>';
    };
    row.appendChild(b);
  });
  root.append(q,row,fb);
  api.destroy=()=>row.querySelectorAll('button').forEach(b=>b.onclick=null);
  return api;
}
/* 答案输入：数字 */
function answerRow(placeholder,onSubmit){
  const root=el('div','answer-row');
  const inp=el('input');inp.className='eq-input';inp.type='text';inp.placeholder=placeholder;
  const fb=el('div','input-fb');
  const b=el('button','btn go');b.type='button';b.textContent='核对';
  b.onclick=()=>onSubmit(inp.value,fb);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')b.click();});
  root.append(inp,fb,b);
  return{root,destroy(){b.onclick=null;}};
}
/* 一元一次方程判定：唯一根、线性、全角兼容 */
function parseLinear(expr,root){
  const e=toHalfWidth(expr).replace(/[tT]/g,'x');
  if(!e.includes('='))return{err:'要有等号，写成左右两边相等'};
  const parts=e.split('=');
  if(parts.length!==2)return{err:'只能有一个等号'};
  const mk=s=>{
    let c=s.replace(/[^0-9x+\-*/(). ]/g,'');
    c=c.replace(/(\d)(?=[x(])/g,'$1*').replace(/\)(?=[x(\d])/g,')*').replace(/x(?=[\d(])/g,'x*');
    try{const fn=Function('x','return ('+c+')');fn(1);return fn;}catch{return null;}
  };
  const L=mk(parts[0]),R=mk(parts[1]);
  if(!L||!R)return{err:'式子没写对，检查运算符号和括号'};
  const d=x=>L(x)-R(x);
  if(!near(d(root),0))return{err:'x='+root+' 代进去，两边不相等'};
  const a=root+1,bx=root+3.7;
  const da=d(a),db=d(bx);
  if(near(da,0)||near(db,0))return{err:'这是恒等式或有多个根，不是一元一次方程'};
  const s1=da/(a-root),s2=(db-da)/(bx-a);
  if(!near(s1,s2))return{err:'这是高次方程，有多个根；题目要一元一次'};
  return{ok:true};
}

/* =========================================================
   单位检查：先看每一项是不是同一种东西，再谈算得对不对
   维度 L=长度/工作量，T=时间，M=金钱；复合如 L/T 用指数对象
========================================================= */
function dimObj(spec){
  const d={L:0,T:0,M:0};
  if(!spec||spec==='1')return d;
  const parts=spec.split('/');
  (parts[0]||'').split('').forEach(k=>{if(k in d)d[k]++;});
  (parts[1]||'').split('').forEach(k=>{if(k in d)d[k]--;});
  return d;
}
function sameDim(a,b){return a.L===b.L&&a.T===b.T&&a.M===b.M;}
function mulDim(a,b){return{L:a.L+b.L,T:a.T+b.T,M:a.M+b.M};}
function divDim(a,b){return{L:a.L-b.L,T:a.T-b.T,M:a.M-b.M};}
function numDimOf(v,model){
  if(!model._numMap){
    const mp=new Map();
    Object.keys(model.numUnit||{}).forEach(k=>mp.set(Number(k),dimObj(model.numUnit[k])));
    model._numMap=mp;
  }
  return model._numMap.has(v)?model._numMap.get(v):null;
}
/* 分词：全角先转半角，x/t 都当变量 */
function tokenize(str){
  const s=toHalfWidth(str).replace(/\s+/g,'');
  const toks=[];let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/[0-9.]/.test(ch)){
      let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      toks.push({t:'n',v:parseFloat(s.slice(i,j))});i=j;
    }else if(ch==='x'||ch==='X'||ch==='t'||ch==='T'){toks.push({t:'x'});i++;}
    else if('+-*/()'.includes(ch)){toks.push({t:ch});i++;}
    else i++;
  }
  return toks;
}
/* 递归下降解析，支持隐式乘法：240t、(t+12)、3(x+1) */
function parseAst(str){
  const toks=tokenize(str);let p=0;
  const peek=()=>toks[p];
  const eat=v=>{if(toks[p]&&toks[p].t===v){p++;return true;}return false;};
  function parseFactor(){
    const tk=peek();
    if(!tk)throw new Error('空');
    if(tk.t==='n'){p++;return{k:'n',v:tk.v};}
    if(tk.t==='x'){p++;return{k:'x'};}
    if(tk.t==='('){p++;const e=parseTop();if(!eat(')'))throw new Error('括号');return e;}
    if(tk.t==='-'){p++;return{k:'op',op:'-',a:{k:'n',v:0},b:parseFactor()};}
    if(tk.t==='+'){p++;return parseFactor();}
    throw new Error('符号');
  }
  function startsFactor(){const tk=peek();return tk&&(tk.t==='n'||tk.t==='x'||tk.t==='('||tk.t==='-');}
  function parseTerm(){
    let node=parseFactor();
    for(;;){
      if(peek()&&peek().t==='*'){p++;node={k:'op',op:'*',a:node,b:parseFactor()};}
      else if(peek()&&peek().t==='/'){p++;node={k:'op',op:'/',a:node,b:parseFactor()};}
      else if(startsFactor()){node={k:'op',op:'*',a:node,b:parseFactor()};}
      else break;
    }
    return node;
  }
  function parseTop(){
    let node=parseTerm();
    while(peek()&&(peek().t==='+'||peek().t==='-')){
      const op=peek().t;p++;
      node={k:'op',op,a:node,b:parseTerm()};
    }
    return node;
  }
  const ast=parseTop();
  if(p!==toks.length)throw new Error('多余符号');
  return ast;
}
function evalAst(n,x){
  if(n.k==='n')return n.v;
  if(n.k==='x')return x;
  const a=evalAst(n.a,x),b=evalAst(n.b,x);
  if(n.op==='+')return a+b;
  if(n.op==='-')return a-b;
  if(n.op==='*')return a*b;
  return a/b;
}
/* 维度名和颜色 */
function unitName(d,model){
  if(d===null)return{name:'?',cls:'unk'};
  const{L,T,M}=d;
  if(L===1&&T===0&&M===0)return{name:model.Lname,cls:'L'};
  if(L===0&&T===1&&M===0)return{name:model.Tname,cls:'T'};
  if(L===1&&T===-1&&M===0)return{name:model.Lname+'/'+model.Tname,cls:'LT'};
  if(L===0&&T===0&&M===1)return{name:model.Mname||'元',cls:'M'};
  if(L===0&&T===0&&M===0)return{name:'',cls:'one'};
  return{name:'?',cls:'unk'};
}
function unitTag(u){return u.name?` <span class="ut ut-${u.cls}">${u.name}</span>`:'';}
/* 推维度，冲突记进 clashes，含未知量则该子树返回 null（不冤枉） */
function dimOf(node,model,clashes){
  if(node.k==='n')return numDimOf(node.v,model);
  if(node.k==='x')return model.xDim;
  const da=dimOf(node.a,model,clashes),db=dimOf(node.b,model,clashes);
  if(da===null||db===null)return null;
  if(node.op==='*')return mulDim(da,db);
  if(node.op==='/')return divDim(da,db);
  if(sameDim(da,db))return da;
  clashes.push({da,db});
  return null;
}
/* 带单位渲染：叶子挂单位，冲突的加减号标红 */
function annotate(node,model){
  if(node.k==='n')return{html:String(node.v)+unitTag(unitName(numDimOf(node.v,model),model)),dim:numDimOf(node.v,model)};
  if(node.k==='x')return{html:(model.varName||'x')+unitTag(unitName(model.xDim,model)),dim:model.xDim};
  const A=annotate(node.a,model),B=annotate(node.b,model);
  let dim=null;
  if(A.dim!==null&&B.dim!==null){
    if(node.op==='*')dim=mulDim(A.dim,B.dim);
    else if(node.op==='/')dim=divDim(A.dim,B.dim);
    else if(sameDim(A.dim,B.dim))dim=A.dim;
  }
  const isClash=(node.op==='+'||node.op==='-')&&A.dim!==null&&B.dim!==null&&!sameDim(A.dim,B.dim);
  const opSym=isClash?`<span class="clash-op">${node.op}</span>`:node.op;
  let html=`${A.html} ${opSym} ${B.html}`;
  if((node.op==='*'||node.op==='/')&&dim!==null){
    const u=unitName(dim,model);
    html+=` <span class="ut ut-${u.cls} ut-res">→${u.name}</span>`;
  }
  return{html,dim};
}
/* 单位检查主入口：ok 通过 / clash 冲突 / syntax 语法 / unknown 看不准不拦截 */
function unitCheck(expr,model){
  model.xDim=dimObj(model.xDim||'T');
  const e=toHalfWidth(expr);
  if(!e.includes('='))return{state:'syntax'};
  const parts=e.split('=');
  if(parts.length!==2)return{state:'syntax'};
  let astL,astR;
  try{astL=parseAst(parts[0]);astR=parseAst(parts[1]);}catch{return{state:'syntax'};}
  const clashes=[];
  const dL=dimOf(astL,model,clashes),dR=dimOf(astR,model,clashes);
  const eqClash=dL!==null&&dR!==null&&!sameDim(dL,dR);
  if(clashes.length===0&&!eqClash&&dL!==null&&dR!==null)return{state:'ok'};
  if(clashes.length>0||eqClash){
    return{state:'clash',hL:annotate(astL,model).html,hR:annotate(astR,model).html,clashes,eqClash};
  }
  return{state:'unknown'};
}
function clashNote(uc,model){
  if(uc.clashes&&uc.clashes.length){
    const c=uc.clashes[0];
    return unitName(c.da,model).name+' 和 '+unitName(c.db,model).name+' 不是一种东西，不能直接加';
  }
  return '等号两边不是一种东西，对不上';
}
function unitCardHtml(uc,model){
  const eq=uc.eqClash?'<span class="clash-op">=</span>':'=';
  return `<div class="unit-card">
    <div class="unit-title">先看单位，每一项是不是同一种东西</div>
    <div class="unit-eq">${uc.hL} ${eq} ${uc.hR}</div>
    <div class="unit-note">${clashNote(uc,model)}</div>
    <div class="unit-hint">${model.hint||''}</div>
    <button type="button" class="btn unit-fix">我回去改</button>
  </div>`;
}
/* 方程输入：单位检查先过，再走数值判定；成功才 onPass */
function equationRow(placeholder,model,onPass){
  const root=el('div','answer-row');
  const inp=el('input');inp.className='eq-input';inp.type='text';inp.placeholder=placeholder;
  const fb=el('div','input-fb');
  const b=el('button','btn go');b.type='button';b.textContent='核对我的方程';
  b.onclick=()=>{
    let uc;
    try{uc=unitCheck(inp.value,model);}catch{uc={state:'unknown'};}
    if(uc.state==='clash'){
      fb.innerHTML=unitCardHtml(uc,model);
      const fix=fb.querySelector('.unit-fix');
      if(fix)fix.onclick=()=>{inp.focus();inp.select();};
      return;
    }
    const r=parseLinear(inp.value,model.x);
    if(r.ok)onPass();
    else fb.innerHTML=`<span style="color:var(--red);font-weight:800">${r.err}</span>`;
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')b.click();});
  root.append(inp,fb,b);
  return{root,destroy(){b.onclick=null;}};
}

   const cap=el('div','range-cap');
   cap.innerHTML=`<span>慢 ${D.slow}/天</span><span class="range-val" style="font-size:18px">总数 <b id="xv">${x}</b> 个</span><span>快 ${D.fast}/天</span>`;
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)node&&slot.appendChild(node);}
   function draw(){
     $('#xv').textContent=x;
     const plan=x/D.slow,act=x/D.fast,end=act+D.fixed;
     const max=Math.max(plan,end)+2;
     const wp=plan/max*100,wa=act/max*100,wf=D.fixed/max*100;
     const match=near(end,plan);
     let state;
     if(match)state=`<span style="color:#059669">接上固定的 ${D.fixed} 天后，正好对齐计划</span>`;
     else if(end>plan)state=`<span style="color:var(--red)">接上后到第 ${r2(end)} 天，比计划还<b>多出 ${r2(end-plan)}</b> 天</span>`;
     else state=`<span style="color:#D97706">接上后到第 ${r2(end)} 天，离计划<b>还差 ${r2(plan-end)}</b> 天</span>`;
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:18px;width:100%">
       <div><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px">原计划（慢）· ${r2(plan)} 天</div>
         <div class="hbar"><div class="hseg" style="width:${wp}%;background:#3B82F6">计划用时</div></div></div>
       <div><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px">实际（快）· ${r2(act)} 天 ${connected?'+ 固定 '+D.fixed+' 天':''}</div>
         <div class="hbar"><div class="hseg" style="width:${wa}%;background:#14B8A6">实际用时</div>
         <div class="hseg ghost-seg" style="width:${connected?wf:0}%">固定 ${D.fixed} 天</div></div></div>
       <div style="font-size:13.5px;font-weight:800;text-align:center">${state}</div>
     </div>`;
   }
   rng.oninput=()=>{x=+rng.value;connected=false;resetReveals();draw();
     const b=el('button','btn go');b.type='button';b.textContent=`把固定的 ${D.fixed} 天接到实际末尾`;
     b.onclick=()=>{connected=true;draw();afterConnect();};
     setSlot(b);cleanups.push(()=>b.onclick=null);};
   function afterConnect(){
     const plan=x/D.slow,act=x/D.fast,end=act+D.fixed,match=near(end,plan);
     const tb=thinkBox(`看两条线，现在是什么情况？`,[
       {label:'正好对齐计划',correct:match,hint:match?'':'看结束位置和计划条一样长吗。'},
       {label:'比计划多出了',correct:end>plan,hint:end>plan?'':'实际条的结束刻度超过计划了吗？'},
       {label:'还没到计划',correct:end<plan,hint:end<plan?'':'结束刻度在计划条左边还是右边？'}
     ]);
     tb.onPass=()=>{
       if(match){
         showReveal('1',`实际用时 + ${D.fixed} = 计划用时`,
           `x/${D.fast} + ${D.fixed} = x/${D.slow}：同一批货，快做省下来的时间正好是 ${D.fixed} 天。`);
         const b=el('button','btn go');b.type='button';b.textContent='我自己算总数';
         b.onclick=()=>askTotal();setSlot(b);cleanups.push(()=>b.onclick=null);
       }else{
         const b=el('button','btn go');b.type='button';b.textContent='改总数，再试';
         b.onclick=()=>{resetReveals();draw();
           const c=el('button','btn go');c.type='button';c.textContent=`把固定的 ${D.fixed} 天接到实际末尾`;
           c.onclick=()=>{connected=true;draw();afterConnect();};
           setSlot(c);cleanups.push(()=>c.onclick=null);};
         setSlot(b);cleanups.push(()=>b.onclick=null);
       }
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function askTotal(){
     clearNode(fig);
     fig.innerHTML=`<div style="font-size:13.5px;color:var(--sub);text-align:center">解出方程，把总数填进去。</div>`;
     const ar=answerRow('这批零件一共多少个？',(val,fb)=>{
       const n=numOf(val);
       if(near(n,D.answer)){
         showReveal('2',`x = ${D.answer}（计划 ${D.answer/D.slow} 天、实际 ${D.answer/D.fast} 天）`,
           `代回：${D.answer}/${D.slow}=${D.answer/D.slow}，${D.answer}/${D.fast}=${D.answer/D.fast}，差正好 ${D.fixed}。`);
         markDone();
         const b=el('button','btn go');b.type='button';b.textContent='再玩一次';
         b.onclick=()=>{resetReveals();connected=false;draw();
           const c=el('button','btn go');c.type='button';c.textContent=`把固定的 ${D.fixed} 天接到实际末尾`;
           c.onclick=()=>{connected=true;draw();afterConnect();};
           setSlot(c);cleanups.push(()=>c.onclick=null);};
         setSlot(b);cleanups.push(()=>b.onclick=null);
       }else fb.innerHTML=`<span style="color:var(--red);font-weight:800">不对，回到方程再算。</span>`;
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig,slot);stage.appendChild(wrap);draw();
   const b0=el('button','btn go');b0.type='button';b0.textContent=`把固定的 ${D.fixed} 天接到实际末尾`;
   b0.onclick=()=>{connected=true;draw();afterConnect();};
   setSlot(b0);cleanups.push(()=>b0.onclick=null);
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});rng.oninput=null;}};
 }
},
bus:{
 name:'春游租车',
 stem:'同学春游。<b>租 45 座的车，有 15 人没座位</b>；改成<b>租 60 座的车，可以少租 1 辆，而且正好坐满</b>。45 座每辆租金 220 元，60 座每辆 300 元。一共多少人、原计划租几辆？怎样租车最省钱？',
 drill:{stem:'同学春游。<b>租 40 座的车，有 10 人没座位</b>；改成<b>租 50 座的车，可以少租 1 辆，而且正好坐满</b>。40 座每辆租金 200 元，50 座每辆 260 元。一共多少人、原计划租几辆？怎样租车最省钱？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{small:40,big:50,stand:10,n:6,people:250,sr:200,br:260,
       cands:[{s:7,b:0,cost:1400},{s:5,b:1,cost:1260},{s:0,b:5,cost:1300}],bestCost:1260}
     :{small:45,big:60,stand:15,n:5,people:240,sr:220,br:300,
       cands:[{s:6,b:0,cost:1320},{s:4,b:1,cost:1180},{s:0,b:4,cost:1200}],bestCost:1180};
   let n=3,swapped=false;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=2;rng.max=9;rng.step=1;rng.value=n;
   const cap=el('div','range-cap');
   cap.innerHTML=`<span>2 辆</span><span class="range-val" style="font-size:18px">原计划 <b id="nv">${n}</b> 辆</span><span>9 辆</span>`;
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   const cars=(num,c)=>SVG.box(c).repeat(Math.max(0,Math.min(num,8)));
   function draw(){
     $('#nv').textContent=n;
     const L=D.small*n+D.stand,R=D.big*(n-1);
     let diff;
     if(near(L,R))diff=`<span style="color:#059669">${D.big} 座车正好接住 ${L} 人</span>`;
     else if(L>R)diff=`<span style="color:var(--red)">${D.big} 座只有 ${R} 个座，还<b>缺 ${L-R}</b> 个座位</span>`;
     else diff=`<span style="color:#D97706">座位比人多，<b>空出 ${R-L}</b> 个座</span>`;
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px;width:100%">
       <div><div style="font-size:12.5px;font-weight:800;color:var(--blue);margin-bottom:6px">${D.small} 座方案：${n} 辆 + ${D.stand} 人站着 = ${L} 人</div>
         <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">${cars(n,'#3B82F6')}
           <span style="font-size:12px;font-weight:800;color:#D97706">${D.stand} 人没座</span></div></div>
       <div><div style="font-size:12.5px;font-weight:800;color:var(--teal);margin-bottom:6px">${D.big} 座方案：少租 1 辆（${n-1} 辆）= ${R} 个座位</div>
         <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;opacity:${swapped?1:.35}">${cars(n-1,'#14B8A6')}</div></div>
       <div style="font-size:13.5px;font-weight:800;text-align:center">${swapped?diff:''}</div>
     </div>`;
   }
   function afterSwap(){
     const L=D.small*n+D.stand,R=D.big*(n-1),match=near(L,R);
     const tb=thinkBox('换车后，座位和人是什么关系？',[
       {label:'正好接住',correct:match,hint:match?'':'看下面红色或橙色的提示。'},
       {label:'还缺座位',correct:L>R,hint:L>R?'':'车的座位真的不够吗？数一下。'},
       {label:'有空座位',correct:R>L,hint:R>L?'':'座位比人多还是少？'}
     ]);
     tb.onPass=()=>{
       if(match){
         showReveal('1',`${D.small}n+${D.stand} = ${D.big}(n−1)`,'撤一辆小车，多出来的座位正好接住站着的人；两批是同一群人。');
         const b=el('button','btn go');b.type='button';b.textContent='我自己算人数和辆数';
         b.onclick=()=>askPeople();setSlot(b);cleanups.push(()=>b.onclick=null);
       }else{
         const b=el('button','btn go');b.type='button';b.textContent='改辆数，再试';
         b.onclick=()=>prepSwap();setSlot(b);cleanups.push(()=>b.onclick=null);
       }
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function prepSwap(){
     const b=el('button','btn go');b.type='button';b.textContent=`把车队换成 ${D.big} 座车`;
     b.onclick=()=>{swapped=true;draw();afterSwap();};
     setSlot(b);cleanups.push(()=>b.onclick=null);
   }
   function askPeople(){
     const ar=answerRow('先填原计划租几辆',(val,fb)=>{
       if(near(numOf(val),D.n)){
         const ar2=answerRow('一共多少人？',(v2,f2)=>{
           if(near(numOf(v2),D.people)){askCost();}
           else f2.innerHTML='<span style="color:var(--red);font-weight:800">不对，用辆数乘座位再加站着的人。</span>';
         });
         setSlot(ar2.root);cleanups.push(ar2.destroy);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">辆数不对，回到方程再解。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   function askCost(){
     clearNode(fig);
     fig.innerHTML=`<div style="font-size:13.5px;color:var(--sub);text-align:center">
       小车 ${D.sr}/辆、大车 ${D.br}/辆。算出每个方案的费用，选最省的。</div>`;
     const tb=thinkBox('哪个方案最省钱？',D.cands.map(c=>({
       label:`${c.s} 小 + ${c.b} 大`,
       correct:c.cost===D.bestCost,
       hint:'把每辆车的租金加起来再比。'
     })));
     tb.onPass=()=>{
       showReveal('2',`最省 ${D.bestCost} 元，共 ${D.people} 人、原计划 ${D.n} 辆`,
         '代回：座位正好够人，费用在几个方案里最低。');
       markDone();
       const b=el('button','btn go');b.type='button';b.textContent='再玩一次';
       b.onclick=()=>{resetReveals();swapped=false;n=3;rng.value=3;draw();prepSwap();};
       setSlot(b);cleanups.push(()=>b.onclick=null);
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   rng.oninput=()=>{n=+rng.value;swapped=false;resetReveals();draw();prepSwap();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig,slot);stage.appendChild(wrap);draw();prepSwap();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});rng.oninput=null;}};
 }
},
box:{
 name:'每箱装多少',
 stem:'<b>5 台 A 机器</b>一天的产品，装满 8 箱还剩 4 个；<b>7 台 B 机器</b>一天的产品，装满 11 箱还剩 1 个。已知<b>每台 A 比每台 B 多产 1 个</b>。每箱装多少个？',
 drill:{stem:'<b>4 台 A 机器</b>一天的产品，装满 6 箱正好；<b>5 台 B 机器</b>一天的产品，装满 7 箱正好。已知<b>每台 A 比每台 B 多产 1 个</b>。每箱装多少个？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{mA:4,aBox:6,aRest:0,mB:5,bBox:7,bRest:0,x:10,A:15,B:14,min:4,max:18}
     :{mA:5,aBox:8,aRest:4,mB:7,bBox:11,bRest:1,x:12,A:20,B:19,min:4,max:20};
   let x=8,fixed=false;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=D.min;rng.max=D.max;rng.step=1;rng.value=x;
   const cap=el('div','range-cap');
   cap.innerHTML=`<span>${D.min} 个/箱</span><span class="range-val" style="font-size:18px">每箱 <b id="bxv">${x}</b> 个</span><span>${D.max} 个/箱</span>`;
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   const isInt=v=>near(v,Math.round(v));
   function vals(){return{A:(D.aBox*x+D.aRest)/D.mA,B:(D.bBox*x+D.bRest)/D.mB};}
   function showV(v){return isInt(v)?('= '+v):('≈ '+r2(v));}
   function draw(){
     $('#bxv').textContent=x;
     const v=vals();
     const delta=v.A-(v.B+1);
     let status;
     if(near(delta,0))status='<span style="color:#059669">补 1 个后，B 和 A 一样长</span>';
     else if(delta>0)status=`<span style="color:var(--red)">补 1 个后还差 ${r2(delta)} 个</span>`;
     else status=`<span style="color:#D97706">补 1 个后反而多出 ${r2(-delta)} 个</span>`;
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px;width:100%">
       <div style="font-size:12.5px;color:var(--sub);text-align:center">单台机器一天的产量（条长按精确值，不四舍五入）</div>
       <div><div style="font-size:12px;font-weight:800;color:var(--blue);margin-bottom:5px">单台 A = (${D.aBox}×${x}+${D.aRest})/${D.mA} ${showV(v.A)} 个</div>
         <div class="hbar"><div class="hseg" style="width:${v.A/22*100}%;background:#3B82F6">A</div></div></div>
       <div><div style="font-size:12px;font-weight:800;color:var(--teal);margin-bottom:5px">单台 B = (${D.bBox}×${x}+${D.bRest})/${D.mB} ${showV(v.B)} 个</div>
         <div class="hbar"><div class="hseg" style="width:${v.B/22*100}%;background:#14B8A6">B</div>
         <div class="hseg" style="width:${fixed?1/22*100:0}%;background:#F59E0B">+1</div></div></div>
       <div style="font-size:13px;font-weight:800;text-align:center">${fixed?status:''}</div>
     </div>`;
   }
   function afterFix(){
     const v=vals(),match=near(v.A,v.B+1);
     const tb=thinkBox('给 B 补 1 个后，两条条什么关系？',[
       {label:'正好对齐',correct:match,hint:match?'':'看下面红或橙色提示。'},
       {label:'还差一些',correct:v.A>v.B+1,hint:v.A>v.B+1?'':'A 条的结束位置比 B+1 长吗？'},
       {label:'反而多出',correct:v.B+1>v.A,hint:v.B+1>v.A?'':'B+1 条超过 A 了吗？'}
     ]);
     tb.onPass=()=>{
       if(match){
         showReveal('1','单台 A = 单台 B + 1',`(${D.aBox}x+${D.aRest})/${D.mA} = (${D.bBox}x+${D.bRest})/${D.mB} + 1`);
         const b=el('button','btn go');b.type='button';b.textContent='我自己算每箱个数';
         b.onclick=()=>askX();setSlot(b);cleanups.push(()=>b.onclick=null);
       }else{
         const b=el('button','btn go');b.type='button';b.textContent='改每箱数，再试';
         b.onclick=()=>prepFix();setSlot(b);cleanups.push(()=>b.onclick=null);
       }
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function prepFix(){
     const b=el('button','btn go');b.type='button';b.textContent='给一台 B 补 1 个';
     b.onclick=()=>{fixed=true;draw();afterFix();};
     setSlot(b);cleanups.push(()=>b.onclick=null);
   }
   function askX(){
     const ar=answerRow('每箱装多少个？',(val,fb)=>{
       if(near(numOf(val),D.x)){
         showReveal('2',`x = ${D.x}（A=${D.A}、B=${D.B}）`,
           `代回：单台 A ${D.A}、单台 B ${D.B}，正好差 1，都是整数。`);
         markDone();
         const b=el('button','btn go');b.type='button';b.textContent='再玩一次';
         b.onclick=()=>{resetReveals();fixed=false;x=8;rng.value=8;draw();prepFix();};
         setSlot(b);cleanups.push(()=>b.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，回到方程再解。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   rng.oninput=()=>{x=+rng.value;fixed=false;resetReveals();draw();prepFix();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig,slot);stage.appendChild(wrap);draw();prepFix();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});rng.oninput=null;}};
 }
},
tunnel:{
 name:'挖隧道还要多久',
 stem:'挖一条长 <b>146 米</b>的隧道。前 3 天一共挖了 <b>26 米</b>（前 2 天只有甲，第 3 天起甲乙一起）。已知<b>甲每天比乙多挖 2 米</b>。照这样算，剩下的还要多少天？',
 drill:{stem:'挖一条长 <b>142 米</b>的隧道。前 3 天一共挖了 <b>22 米</b>（前 2 天只有甲，第 3 天起甲乙一起）。已知<b>甲每天比乙多挖 2 米</b>。照这样算，剩下的还要多少天？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{L:142,S:22,b:4,jia:6,base:16,remain:120,days:12}
     :{L:146,S:26,b:5,jia:7,base:20,remain:120,days:10};
   let removed=0;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   const SC=13;
   function col(parts,label){
     return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
       <div style="display:flex;flex-direction:column-reverse;justify-content:flex-start;height:${12*SC}px">
         ${parts.map(p=>p.fade
           ?`<div style="width:46px;height:${p.h*SC}px;background:transparent;border:2px dashed #CBD5E1;border-radius:5px"></div>`
           :`<div style="width:46px;height:${p.h*SC}px;background:${p.c};border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff">${p.t||''}</div>`
         ).join('')}
       </div><div style="font-size:11px;font-weight:800;color:var(--sub)">${label}</div></div>`;
   }
   function draw(){
     const p1=[{h:D.b,c:'#3B82F6'},{h:2,c:'#F59E0B',t:'2',fade:removed>0}];
     const p2=[{h:D.b,c:'#3B82F6'},{h:2,c:'#F59E0B',t:'2',fade:removed>1}];
     const p3=[{h:D.b,c:'#14B8A6'},{h:D.b,c:'#3B82F6'},{h:2,c:'#F59E0B',t:'2',fade:removed>2}];
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%">
       <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap">

       <div style="font-size:13px;font-weight:800;color:var(--sub)">
         ${removed<3?`橙色是甲每天多挖的 2 米（还剩 ${3-removed} 段没扣）`:`扣完 3 段，剩下 ${D.base} 米`}</div>
     </div>`;
   }
   function prepRemove(){
     const b=el('button','btn go');b.type='button';
     b.textContent=removed<3?`扣掉甲多挖的 2 米（第 ${removed+1} 段）`:'';
     b.onclick=()=>{removed++;draw();if(removed<3)prepRemove();else askParts();};
     setSlot(b);cleanups.push(()=>b.onclick=null);
   }
   function askParts(){
     const tb=thinkBox(`扣完后剩下 ${D.base} 米。这是哪几份？`,[
       {label:'4 份，每份就是乙每天挖的',correct:true},
       {label:'3 份，对应 3 天',hint:'前2天各有1份基础，第3天有2份，加起来数。'},
       {label:'6 份',hint:'扣掉橙色后，看每根柱子里还剩几段实心的。'}
     ]);
     tb.onPass=()=>{
       showReveal('1',`${D.S} − 3×2 = ${D.base} = 4 份乙的日工作量`,
         `每份 ${D.base}/4 = ${D.b} 米，所以乙每天 ${D.b} 米、甲每天 ${D.jia} 米。`);
       const b=el('button','btn go');b.type='button';b.textContent='我自己算还要多少天';
       b.onclick=()=>askDays();setSlot(b);cleanups.push(()=>b.onclick=null);
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function askDays(){
     const ar=answerRow(`全长 ${D.L}、已挖 ${D.S}，剩下还要几天？`,(val,fb)=>{
       if(near(numOf(val),D.days)){
         showReveal('2',`剩 ${D.remain} ÷ (${D.jia}+${D.b}) = ${D.days} 天`,
           `代回：两人合挖每天 ${D.jia+D.b} 米，${D.days} 天完成剩下的 ${D.remain} 米。`);
         markDone();
         const b=el('button','btn go');b.type='button';b.textContent='再玩一次';
         b.onclick=()=>{resetReveals();removed=0;draw();prepRemove();};
         setSlot(b);cleanups.push(()=>b.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，先算剩下多少米，再除以合挖速度。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   wrap.append(fig,slot);stage.appendChild(wrap);draw();prepRemove();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});}};
 }
},
save:{
 name:'定期的本金',
 stem:'一笔钱存银行三年定期，<b>年利率 2.2%（单利）</b>，到期<b>本金加利息一共 21320 元</b>。当初存进去的本金是多少？',
 drill:{stem:'一笔钱存两年定期，<b>年利率 3%（单利）</b>，到期<b>本金加利息一共 5300 元</b>。当初存进去的本金是多少？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{rate:0.03,years:2,goal:5300,P:5000,min:3000,max:7000,step:100,start:4000}
     :{rate:0.022,years:3,goal:21320,P:20000,min:12000,max:26000,step:200,start:18000};
   const factor=1+D.rate*D.years;
   let P=D.start;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=D.min;rng.max=D.max;rng.step=D.step;rng.value=P;
   const cap=el('div','range-cap');
   cap.innerHTML=`<span>${D.min}</span><span class="range-val" style="font-size:18px">本金 <b id="sv">${P}</b> 元</span><span>${D.max}</span>`;
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   const maxV=D.max*factor;
   function draw(){
     $('#sv').textContent=P;
     const total=P*factor,int=P*D.rate;
     const wP=P/maxV*100,wI=int/maxV*100,goal=D.goal/maxV*100;
     const bal=near(total,D.goal);
     let msg;
     if(bal)msg=`<span style="color:#059669">到期 ${r2(total)}，正好 ${D.goal}</span>`;
     else if(total<D.goal)msg=`<span style="color:#D97706">到期 ${r2(total)}，还差 ${r2(D.goal-total)} 元</span>`;
     else msg=`<span style="color:var(--red)">到期 ${r2(total)}，已经超过 ${r2(total-D.goal)} 元</span>`;
     let segs='';
     for(let i=0;i<D.years;i++){const cols=['#F59E0B','#FB923C','#FBBF24'];segs+=`<div class="hseg" style="width:${wI}%;background:${cols[i]}">${D.rate*100}%</div>`;}
     clearNode(fig);
     fig.innerHTML=`<div style="width:100%;position:relative">
       <div style="position:absolute;left:${goal}%;top:-6px;bottom:-6px;width:2px;background:#EF4444;z-index:2"></div>
       <div style="position:absolute;left:${goal}%;top:-22px;transform:translateX(-50%);font-size:11px;font-weight:800;color:#EF4444;white-space:nowrap">${D.goal}</div>
       <div class="hbar" style="margin-top:14px"><div class="hseg" style="width:${wP}%;background:#3B82F6">本金 ${P}</div>${segs}</div>
       <div style="text-align:center;font-size:13.5px;font-weight:800;margin-top:12px">${msg}</div>
     </div>`;
   }
   const b=el('button','btn go');b.type='button';b.textContent='我看清利息怎么算了';
   b.onclick=()=>{
     const tb=thinkBox('每一段利息，是按什么算出来的？',[
       {label:'都按同一笔本金乘年利率',correct:true},
       {label:'按到期总额算',hint:'利息段在本金右边，先有本金才生利息。'},
       {label:'每段利息不一样、互相独立',hint:'拖动本金看，每段长度都等于本金乘同一个利率。'}
     ]);
     tb.onPass=()=>{
       showReveal('1',`本金 + ${D.years} 段利息 = ${D.goal}`,
         `P + ${D.rate*100}%×${D.years}×P = ${D.goal}，也就是 ${r2(factor)}P = ${D.goal}。`);
       const c=el('button','btn go');c.type='button';c.textContent='我自己求本金';
       c.onclick=()=>askP();setSlot(c);cleanups.push(()=>c.onclick=null);
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   };
   function askP(){
     const ar=answerRow('本金是多少？',(val,fb)=>{
       if(near(numOf(val),D.P)){
         showReveal('2',`P = ${D.P}，${D.P}×${factor} = ${D.P*factor}`,
           `代回：本金 ${D.P}，${D.years} 年利息 ${D.P*factor-D.P}，合计 ${D.goal}。`);
         markDone();
         const c=el('button','btn go');c.type='button';c.textContent='再玩一次';
         c.onclick=()=>{resetReveals();P=D.start;rng.value=P;draw();
           setSlot(b);};
         setSlot(c);cleanups.push(()=>c.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，回到方程再解。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   rng.oninput=()=>{P=+rng.value;resetReveals();draw();setSlot(b);};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig,slot);stage.appendChild(wrap);draw();setSlot(b);
   cleanups.push(()=>b.onclick=null);
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});rng.oninput=null;}};
 }
},
work:{
 name:'甲乙合作要几天',
 stem:'一项工程，<b>甲单独做 20 天完成，乙单独做 30 天完成</b>。若甲先单独做 4 天，再由甲乙合作 x 天完成。先自己列方程，再求合作天数。',
 drill:{stem:'一项工程，<b>甲单独做 15 天完成，乙单独做 10 天完成</b>。若甲先单独做 3 天，再由甲乙合作 x 天完成。先自己列方程，再求合作天数。'},
 build(stage,variant){
   const D=variant==='drill'
     ?{adays:15,bdays:10,preDays:3,ag:4,bg:6,x:4.8,pre:12}
     :{adays:20,bdays:30,preDays:4,ag:3,bg:2,x:9.6,pre:12};
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   let cells='';
   for(let i=0;i<60;i++)cells+=`<div class="cell ${i<D.pre?'a':''}"></div>`;
   function baseFig(){
     clearNode(fig);
     fig.innerHTML=`<div style="width:100%">
       <div class="tank">${cells}</div>
       <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--sub);margin-top:6px;gap:8px;flex-wrap:wrap">
         <span>↑ 甲先做 ${D.preDays} 天 = ${D.pre} 格</span><span>剩下 ${60-D.pre} 格，两人合作</span></div>
     </div>`;
   }
   function step1(){
     const tb=thinkBox(`整项 60 格，甲单独 ${D.adays} 天做完。甲每天做几格？`,[
       {label:`${D.ag} 格/天`,correct:true},
       {label:`${D.bg} 格/天`,hint:'60 格除以甲单独的天数，再算一次。'},
       {label:`${D.ag+D.bg} 格/天`,hint:'这是两人加起来，不是甲一个人。'}
     ]);
     tb.onPass=()=>{step2();};
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function step2(){
     const tb=thinkBox(`乙单独 ${D.bdays} 天做完 60 格。乙每天做几格？`,[
       {label:`${D.bg} 格/天`,correct:true},
       {label:`${D.ag} 格/天`,hint:'60 除以乙单独的天数。'},
       {label:`${D.ag+D.bg} 格/天`,hint:'这是两人合起来的速度。'}
     ]);
     tb.onPass=()=>{
       clearNode(fig);
       let c2='';
       for(let i=0;i<60;i++)c2+=`<div class="cell ${i<D.pre?'a':(i<D.pre+D.ag+D.bg?'c':'')}"></div>`;
       fig.innerHTML=`<div style="width:100%"><div class="tank">${c2}</div>
         <div style="font-size:12.5px;font-weight:800;color:var(--sub);margin-top:8px;text-align:center">
           合作一天：甲 ${D.ag} + 乙 ${D.bg} = ${D.ag+D.bg} 格/天</div></div>`;
       askEquation();
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function askEquation(){
     const model={
       x:D.x,xDim:'T',varName:'x',Lname:'格',Tname:'天',
       numUnit:{[D.pre]:'L',60:'L',[D.ag]:'L/T',[D.bg]:'L/T',[D.ag+D.bg]:'L/T'},
       hint:'x 是天数，得先乘每天做的格数把它变成格，才能和格相加。'
     };
     const er=equationRow('列方程，比如 12+5x=60（全角符号也可以）',model,()=>{
       resetReveals();
       showReveal('1','甲先做的 + 合作段 = 整项 60 格',
         `${D.pre} + ${D.ag+D.bg}x = 60，和你写的方程等价。`);
       const c=el('button','btn go');c.type='button';c.textContent='我解出天数了';
       c.onclick=()=>askDays();setSlot(c);cleanups.push(()=>c.onclick=null);
     });
     setSlot(er.root);cleanups.push(er.destroy);
   }
   function askDays(){
     const ar=answerRow('合作天数 x 是多少？',(val,fb)=>{
       if(near(numOf(val),D.x)){
         showReveal('2',`x = ${D.x}，${D.pre}+${D.ag+D.bg}×${D.x} = 60`,
           `代回：合作 ${D.x} 天完成 ${60-D.pre} 格，加甲先做的 ${D.pre}，正好 60。`);
         markDone();
         const c=el('button','btn go');c.type='button';c.textContent='再玩一次';
         c.onclick=()=>{resetReveals();baseFig();step1();};
         setSlot(c);cleanups.push(()=>c.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">天数不对，回到方程再解。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   wrap.append(fig,slot);stage.appendChild(wrap);baseFig();step1();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});}};
 }
},
cart:{
 name:'电瓶车人数与票款',
 stem:'旅行团坐电瓶车，每人至少乘一程。<b>单程票每张 20 元，往返票每张 30 元（比两张单程省 10 元）</b>。这次<b>去程记录 15 条、回程记录 10 条，总票款 410 元</b>。多少人买了往返、多少人只坐一程？一共多少人？',
 drill:{stem:'旅行团坐电瓶车，每人至少乘一程。<b>单程票每张 10 元，往返票每张 15 元（比两张单程省 5 元）</b>。这次<b>去程记录 11 条、回程记录 7 条，总票款 145 元</b>。多少人买了往返、一共多少人？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{single:10,rt:15,save:5,go:11,back:7,goal:145,all:180,pairs:7,people:11}
     :{single:20,rt:30,save:10,go:15,back:10,goal:410,all:500,pairs:9,people:16};
   let p=0;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   const rt=(c,bg)=>`<div style="width:30px;height:30px;border-radius:7px;background:${bg};display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff">${c}</div>`;
   function fee(){return D.all-D.save*p;}
   function draw(){
     const goLeft=D.go-p,backLeft=D.back-p;
     let pairedHtml='';
     for(let i=0;i<p;i++)pairedHtml+=`<div style="display:flex;align-items:center;gap:3px;border:2px solid #10B981;border-radius:9px;padding:3px 6px;background:#ECFDF5">
       ${rt('去','#3B82F6')}${rt('回','#F59E0B')}<span style="font-size:10.5px;font-weight:800;color:#059669">往返${D.rt}</span></div>`;
     let goHtml='',backHtml='';
     for(let i=0;i<goLeft;i++)goHtml+=rt('去','#3B82F6');
     for(let i=0;i<backLeft;i++)backHtml+=rt('回','#F59E0B');
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;width:100%">
       <div><div style="font-size:11.5px;font-weight:800;color:#059669;margin-bottom:6px">已配成往返 · ${p} 对</div>
         <div style="display:flex;gap:7px;flex-wrap:wrap;min-height:34px">${pairedHtml||'<span style="font-size:12px;color:var(--sub)">还没配对</span>'}</div></div>
       <div><div style="font-size:11.5px;font-weight:800;color:var(--blue);margin-bottom:6px">未配对去程 · ${goLeft} 条</div>
         <div style="display:flex;gap:6px;flex-wrap:wrap">${goHtml||'<span style="font-size:12px;color:var(--sub)">没有了</span>'}</div></div>
       <div><div style="font-size:11.5px;font-weight:800;color:#D97706;margin-bottom:6px">未配对回程 · ${backLeft} 条</div>
         <div style="display:flex;gap:6px;flex-wrap:wrap">${backHtml||'<span style="font-size:12px;color:var(--sub)">没有了</span>'}</div></div>
       <div style="font-size:14px;font-weight:800;text-align:center;color:${near(fee(),D.goal)?'#059669':'var(--ink)'}">
         当前票款 ${fee()} 元（全单程 ${D.all}，每配一对少 ${D.save}）</div>
     </div>`;
   }
   function prepPair(){
     const b=el('button','btn go');b.type='button';b.textContent='把同一人的去程、回程配成一对';
     b.onclick=()=>{
       p++;draw();
       if(near(fee(),D.goal)){afterMatch();}
       else prepPair();
     };
     setSlot(b);cleanups.push(()=>b.onclick=null);
   }
   function afterMatch(){
     const tb=thinkBox('票款正好对上。为什么配一对会少钱？',[
       {label:`往返 ${D.rt} 比两张单程 ${D.single*2} 少 ${D.save}`,correct:true},
       {label:'配对后票款变多',hint:'看票款数字，配对时是变大还是变小。'},
       {label:'票价本身打折，和配对无关',hint:'差额正好等于两张单程减一张往返。'}
     ]);
     tb.onPass=()=>{
       showReveal('1',`全单程 ${D.all} − ${D.save}×${D.pairs} = ${D.goal}`,
         `配 ${D.pairs} 对往返，票款正好 ${D.goal}。`);
       const c=el('button','btn go');c.type='button';c.textContent='我自己数人数';
       c.onclick=()=>askPeople();setSlot(c);cleanups.push(()=>c.onclick=null);
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function askPeople(){
     const ar=answerRow('一共多少人？（每人至少一程）',(val,fb)=>{
       if(near(numOf(val),D.people)){
         showReveal('2',`${D.pairs} 往返 + 未配对 ${D.all-D.pairs*2} 条单程 = ${D.people} 人`,
           variant==='drill'?'代回：每人对应一个往返或一条单程。'
           :`代回：${D.pairs} 人往返、${D.go-p} 人只去、${D.back-p} 人只回，共 ${D.people}。`);
         markDone();
         const c=el('button','btn go');c.type='button';c.textContent='再玩一次';
         c.onclick=()=>{resetReveals();p=0;draw();prepPair();};
         setSlot(c);cleanups.push(()=>c.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，往返对算1人，每条单程算1人。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   wrap.append(fig,slot);stage.appendChild(wrap);draw();prepPair();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});}};
 }
},
chase:{
 name:'良马追驽马',
 stem:'<b>驽马先出发 12 天，每天走 150 里</b>；<b>良马每天走 240 里</b>，随后出发去追。推动时间尺，看它们什么时候并排。',
 drill:{stem:'两人从一条<b>长 75 米的道路两端同时相向出发</b>，一个每秒走 6 米、另一个每秒走 4 米。推动时间尺，看他们几秒相遇。'},
 build(stage,variant){
   const meet=variant==='drill';
   const D=meet?{v1:6,v2:4,D:75,x:7.5,max:12,step:.5}
     :{slow:150,good:240,head:12,x:20,max:24,step:1};
   let t=0;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=0;rng.max=D.max;rng.step=D.step;rng.value=0;
   const cap=el('div','range-cap');
   cap.innerHTML=`<span>起点</span><span class="range-val" style="font-size:18px">经过 <b id="dv">0</b> ${meet?'秒':'天'}</span><span>${D.max}</span>`;
   const runway=el('div');runway.className='runway';
   const info=el('div');info.style.fontSize='13px';info.style.fontWeight='800';info.style.textAlign='center';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   function horse(left,color,ch,label,top){
     return `<div class="runner" style="left:${left}%;top:${top}px;transform:translateX(-50%)">
       <div style="width:36px;height:36px;border-radius:50%;background:${color};display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.18)">${ch}</div>
       <div class="rname" style="color:${color}">${label}</div></div>`;
   }
   function draw(){
     $('#dv').textContent=t;
     let html,l1,l2,gap,equal;
     if(meet){
       const p1=D.v1*t,p2=D.v2*t;
       const g=v=>4+(v/D.D)*92;
       l1=g(p1);l2=100-g(p2);
       equal=near(p1+p2,D.D);
       const line=equal?`<div style="position:absolute;left:${l1}%;top:10px;bottom:8px;width:2px;background:#10B981;transform:translateX(-50%);opacity:.55"></div>`:'';
       html=line+horse(l1,'#3B82F6','甲',p1+' 米',equal?16:24)+horse(l2,'#F59E0B','乙',p2+' 米',equal?84:24);
       if(equal)info.innerHTML='<span style="color:#059669">相遇了！两人走过的加起来 45+30=75 米</span>';
       else if(p1+p2<D.D)info.innerHTML=`还没相遇，两人一共走了 ${r2(p1+p2)} 米，离 75 还差 ${r2(D.D-p1-p2)}`;
       else info.innerHTML=`已经错开，两人走过的和 ${r2(p1+p2)} 超过 75`;
     }else{
       const good=D.good*t,slow=D.slow*(t+D.head);gap=slow-good;
       const g=v=>4+(v/6000)*92;
       l1=g(good);l2=g(slow);
       equal=near(gap,0);
       const line=equal?`<div style="position:absolute;left:${l1}%;top:10px;bottom:8px;width:2px;background:#10B981;transform:translateX(-50%);opacity:.55"></div>`:'';
       html=line+horse(l1,'#3B82F6','良',good+' 里',equal?16:24)+horse(l2,'#F59E0B','驽',slow+' 里',equal?84:24);
       if(equal)info.innerHTML='<span style="color:#059669">并排了！良马 20 天、驽马 32 天，都在 4800 里</span>';
       else if(gap>0)info.innerHTML=`驽马还领先 <b style="color:#D97706">${r2(gap)}</b> 里（每天差距缩 90）`;
       else info.innerHTML=`<span style="color:var(--red)">良马已经反超 ${r2(-gap)} 里</span>`;
     }
     runway.innerHTML=html;
   }
   function firstThink(){
     const q=meet?'两人相向走，相遇时路程怎么算？':'驽马早出发 12 天，良马走 t 天时驽马走几天？';
     const opts=meet?[
       {label:'两段路程加起来 = 总距离 75',correct:true},
       {label:'两人路程相等',hint:'两人速度不同，相遇时走的米数不一样；看他们位置和各自起点。'},
       {label:'快的那个人走完全程',hint:'相遇在中间某处，两人都只走了一部分。'}
     ]:[
       {label:'驽马走了 t+12 天',correct:true},
       {label:'驽马也走了 t 天',hint:'驽马先出发，钟表上它多用了 12 天。'},
       {label:'驽马走了 12 天',hint:'12 天是提前量，之后它还在继续走。'}
     ];
     const tb=thinkBox(q,opts);
     tb.onPass=()=>{prepMove();};
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   let moved=false;
   function prepMove(){
     const b=el('button','btn go');b.type='button';
     b.textContent=meet?'我来推时间尺看相遇':'我来推时间尺看并排';
     b.onclick=()=>{moved=true;setSlot(null);};
     setSlot(b);cleanups.push(()=>b.onclick=null);
   }
   function checkPoint(){
     const q=meet?'现在两人是什么状态？':'现在两匹马是什么状态？';
     const opts=meet?[
       {label:'正好相遇',correct:near(D.v1*t+D.v2*t,D.D),hint:'看绿色提示。'},
       {label:'还没相遇',correct:D.v1*t+D.v2*t<D.D,hint:'两人之间还有空隙吗？'},
       {label:'已经错开',correct:D.v1*t+D.v2*t>D.D,hint:'两人走过头了吗？'}
     ]:[
       {label:'正好并排',correct:near(D.good*t,D.slow*(t+D.head)),hint:'看绿色提示。'},
       {label:'驽马还在前面',correct:D.slow*(t+D.head)>D.good*t,hint:'谁的位置更靠右？'},
       {label:'良马已经反超',correct:D.good*t>D.slow*(t+D.head),hint:'良马跑到右边了吗？'}
     ];
     const tb=thinkBox(q,opts);
     tb.onPass=()=>{
       const done=meet?near(D.v1*t+D.v2*t,D.D):near(D.good*t,D.slow*(t+D.head));
       if(done){
         showReveal('1',meet?'6t + 4t = 75':'240t = 150(t+12)',
           meet?'两段路程之和等于总距离。':'并排时两人路程相等；也可写成 90t=1800。');
         const c=el('button','btn go');c.type='button';c.textContent='我自己列方程';
         c.onclick=()=>askEquation();setSlot(c);cleanups.push(()=>c.onclick=null);
       }else prepMove();
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function askEquation(){
     const model=meet?{
       x:D.x,xDim:'T',varName:'t',Lname:'米',Tname:'秒',
       numUnit:{6:'L/T',4:'L/T',75:'L'},
       hint:'t 是秒数，要先乘每秒走的米数把它变成米，才能和米相加。'
     }:{
       x:D.x,xDim:'T',varName:'t',Lname:'里',Tname:'天',
       numUnit:{150:'L/T',240:'L/T',12:'T',1800:'L'},
       hint:'t 是天数，要先乘每天走的里数把它变成里，才能和里相加。'
     };
     const er=equationRow(meet?'列相遇的方程，比如 6t+4t=75':'列追及的方程，比如 240t=150(t+12)',model,()=>{
       const c=el('button','btn go');c.type='button';c.textContent='我解出时间了';
       c.onclick=()=>askX();setSlot(c);cleanups.push(()=>c.onclick=null);
     });
     setSlot(er.root);cleanups.push(er.destroy);
   }
   function askX(){
     const ar=answerRow(meet?'几秒相遇？':'良马几天追上？',(val,fb)=>{
       if(near(numOf(val),D.x)){
         showReveal('2',meet?'t = 7.5，6×7.5+4×7.5=75':'t = 20，240×20=150×32=4800',
           meet?'代回：两人在同一位置，路程和为全程。':'代回：良马20天、驽马含先跑共32天，位置相同。');
         markDone();
         const c=el('button','btn go');c.type='button';c.textContent='再玩一次';
         c.onclick=()=>{resetReveals();t=0;rng.value=0;draw();firstThink();};
         setSlot(c);cleanups.push(()=>c.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，回到方程再解。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   rng.oninput=()=>{t=+rng.value;draw();if(moved)checkPoint();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,runway,info,slot);stage.appendChild(wrap);draw();firstThink();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});rng.oninput=null;}};
 }
},
match:{
 name:'车间配套最多几套',
 stem:'一个成品要 <b>4 个甲零件、3 个乙零件</b>配成一套。甲组每人每天做 6 个甲，乙组每人每天做 8 个乙，<b>两组共 50 人</b>。调工人换组，看怎么安排做最多套。',
 drill:{stem:'一个成品要 <b>3 个甲零件、2 个乙零件</b>配成一套。甲组每人每天做 5 个甲，乙组每人每天做 4 个乙，<b>两组共 22 人</b>。调工人换组，看怎么安排做最多套。'},
 build(stage,variant){
   const D=variant==='drill'
     ?{needA:3,needB:2,rateA:5,rateB:4,total:22,ja:12,best:20,min:8,max:16,start:10}
     :{needA:4,needB:3,rateA:6,rateB:8,total:50,ja:32,best:48,min:25,max:38,start:30};
   let ja=D.start;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   function chip(kind,empty){
     if(empty)return `<span class="slot" style="width:30px;height:30px"></span>`;
     return `<span class="slot fill ${kind==='A'?'ja':'jb'}" style="width:30px;height:30px">${kind}</span>`;
   }
   function draw(){
     const jb=D.total-ja;
     const aSets=Math.floor(D.rateA*ja/D.needA),bSets=Math.floor(D.rateB*jb/D.needB);
     const sets=Math.min(aSets,bSets);
     const shortA=aSets<bSets,shortB=bSets<aSets;
     let doneSetHtml='',nextSetHtml='';
     for(let i=0;i<D.needA;i++)doneSetHtml+=chip('A',false);
     for(let i=0;i<D.needB;i++)doneSetHtml+=chip('B',false);
     for(let i=0;i<D.needA;i++)nextSetHtml+=chip('A',shortA);
     for(let i=0;i<D.needB;i++)nextSetHtml+=chip('B',shortB);
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;width:100%;align-items:center">
       <div style="font-size:12px;font-weight:800;color:var(--sub)">一套成品（已完成的代表）</div>
       <div class="tray-row">${doneSetHtml}</div>
       <div style="font-size:12px;font-weight:800;color:var(--sub)">正在配的下一套（空槽就是缺的零件）</div>
       <div class="tray-row">${nextSetHtml}</div>
       <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:800">
         <span style="color:${shortA?'#DC2626':'var(--blue)'}">甲能配 ${aSets} 套${shortA?'（甲短缺）':''}</span>
         <span style="color:${shortB?'#DC2626':'var(--orange)'}">乙能配 ${bSets} 套${shortB?'（乙短缺）':''}</span></div>
       <div style="font-size:28px;font-weight:900;color:${!shortA&&!shortB?'#059669':'var(--ink)'}">完整 ${sets} 套</div>
     </div>`;
   }
   function controls(){
     const row=el('div','act-row');
     const minus=el('button','btn');minus.type='button';minus.textContent='甲组 −1（调去乙组）';
     const plus=el('button','btn');plus.type='button';plus.textContent='甲组 +1（调回甲组）';
     minus.onclick=()=>{if(ja>D.min){ja--;afterChange();}};
     plus.onclick=()=>{if(ja<D.max){ja++;afterChange();}};
     row.append(minus,plus);setSlot(row);
     cleanups.push(()=>{minus.onclick=null;plus.onclick=null;});
   }
   function afterChange(){
     resetReveals();draw();
     const jb=D.total-ja;
     const aSets=Math.floor(D.rateA*ja/D.needA),bSets=Math.floor(D.rateB*jb/D.needB);
     if(near(aSets,bSets)){
       const tb=thinkBox('两边能配的套数相等了，为什么这时最多？',[
         {label:'没有短缺、没有余料，两套数都用满',correct:true},
         {label:'甲组人越多越好',hint:'再调一人试试，会变成另一组短缺。'},
         {label:'凭感觉',hint:'看甲、乙各自能配几套，相等时谁都不浪费。'}
       ]);
       tb.onPass=()=>{
         showReveal('1',`${D.rateA}×${ja}/${D.needA} = ${D.rateB}×${D.total-ja}/${D.needB}`,
           '短缺方决定完整套数；两边相等时没有余料，套数最多。');
         const c=el('button','btn go');c.type='button';c.textContent='我自己算最多套数';
         c.onclick=()=>askSets();setSlot(c);cleanups.push(()=>c.onclick=null);
       };
       setSlot(tb.root);cleanups.push(tb.destroy);
     }else controls();
   }
   function askSets(){
     const ar=answerRow('最多能做多少套？',(val,fb)=>{
       if(near(numOf(val),D.best)){
         showReveal('2',`${ja} 人做甲、${D.total-ja} 人做乙，最多 ${D.best} 套`,
           '代回：两边产出都正好凑成完整套，余料为0。');
         markDone();
         const c=el('button','btn go');c.type='button';c.textContent='再玩一次';
         c.onclick=()=>{resetReveals();ja=D.start;draw();controls();};
         setSlot(c);cleanups.push(()=>c.onclick=null);
       }else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，看甲、乙各自能配几套取小的。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   wrap.append(fig,slot);stage.appendChild(wrap);draw();controls();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});}};
 }
},
milk:{
 name:'牛奶加工怎么选',
 stem:'现有鲜奶 <b>9 吨，要在 4 天内全部销售或加工完</b>。直卖鲜奶每吨赚 500 元，做酸奶每吨赚 1200 元（每天 3 吨），做奶片每吨赚 2000 元（每天 1 吨），两种加工不能同时。方案一：尽量多做奶片、其余直卖；方案二：部分奶片、部分酸奶，恰好用满 4 天。选哪个？',
 drill:{stem:'现有鲜奶 <b>8 吨，要在 4 天内全部销售或加工完</b>。直卖每吨 500、酸奶每吨 1200（每天 3 吨）、奶片每吨 2000（每天 1 吨），不能同时加工。方案一：尽量多奶片、其余直卖；方案二：部分奶片、部分酸奶，恰好用满 4 天。选哪个？'},
 build(stage,variant){
   const D=variant==='drill'
     ?{total:8,x:2,p1:10000,p2:11200,start:3}
     :{total:9,x:1.5,p1:10500,p2:12000,start:2};
   let t=D.start;
   const wrap=el('div','stage-inner');wrap.style.width='100%';
   const rng=el('input');rng.type='range';rng.min=0.5;rng.max=3.5;rng.step=0.5;rng.value=t;
   const cap=el('div','range-cap');
   cap.innerHTML=`<span>0.5 天</span><span class="range-val" style="font-size:18px">奶片做 <b id="tv">${t}</b> 天</span><span>3.5 天</span>`;
   const fig=el('div');fig.style.width='100%';
   const slot=el('div');slot.style.width='100%';
   const cleanups=[];
   function setSlot(node){clearNode(slot);if(node)slot.appendChild(node);}
   function calc(){
     const yogDays=4-t,chipT=t,yogT=3*yogDays,proc=chipT+yogT;
     return{yogDays,chipT,yogT,proc,ok:near(proc,D.total)};
   }
   function draw(){
     $('#tv').textContent=r2(t);
     const c=calc();
     const wChip=t/4*100,wYog=c.yogDays/4*100;
     let state;
     if(c.ok)state=`<span style="color:#059669">奶片 ${r2(c.chipT)} + 酸奶 ${r2(c.yogT)} = ${r2(c.proc)} 吨，正好 ${D.total}</span>`;
     else if(c.proc<D.total)state=`<span style="color:#D97706">只能处理 ${r2(c.proc)} 吨，加工不完 ${D.total} 吨，还差 ${r2(D.total-c.proc)}</span>`;
     else state=`<span style="color:var(--red)">能处理 ${r2(c.proc)} 吨，超过鲜奶 ${r2(c.proc-D.total)} 吨，多出的产能用不上</span>`;
     clearNode(fig);
     fig.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;width:100%">
       <div><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">4 天时间分界</div>
         <div class="hbar"><div class="hseg" style="width:${wChip}%;background:#3B82F6">奶片 ${r2(t)} 天</div>
         <div class="hseg" style="width:${wYog}%;background:#F59E0B">酸奶 ${r2(c.yogDays)} 天</div></div></div>
       <div style="font-size:13.5px;font-weight:800;text-align:center">${state}</div>
     </div>`;
   }
   function thinkCap(){
     const c=calc();
     const tb=thinkBox('现在这个安排，产能和 9 吨比怎么样？',[
       {label:'正好处理完',correct:c.ok,hint:'看上面绿/红/橙色提示。'},
       {label:'加工不完，还差',correct:c.proc<D.total,hint:'处理量比 9 吨小还是大？'},
       {label:'产能超过，用不完',correct:c.proc>D.total,hint:'处理量超过鲜奶量了吗？'}
     ]);
     tb.onPass=()=>{
       if(c.ok){
         showReveal('1',`奶片 ${r2(c.chipT)} 吨 + 酸奶 ${r2(c.yogT)} 吨 = ${D.total}，时间 ${r2(t)}+${r2(c.yogDays)}=4`,
           '先满足吨数和4天这两个硬条件，方案才成立。');
         const b=el('button','btn go');b.type='button';b.textContent='我来算两笔利润';
         b.onclick=()=>askP1();setSlot(b);cleanups.push(()=>b.onclick=null);
       }else{
         const b=el('button','btn go');b.type='button';b.textContent='调分界，再试';
         b.onclick=prepMove;setSlot(b);cleanups.push(()=>b.onclick=null);
       }
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   function prepMove(){
     const b=el('button','btn go');b.type='button';b.textContent='确认当前分界';
     b.onclick=()=>thinkCap();setSlot(b);cleanups.push(()=>b.onclick=null);
   }
   function p1Profit(){
     // 4 吨奶片，其余直卖
     return 4*2000+(D.total-4)*500;
   }
   function p2Profit(){
     const c=calc();
     return c.chipT*2000+c.yogT*1200;
   }
   function askP1(){
     const ar=answerRow('方案一利润是多少？（4 吨奶片，其余直卖）',(val,fb)=>{
       if(near(numOf(val),D.p1)){askP2();}
       else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，奶片2000/吨、直卖500/吨，再加一次。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   function askP2(){
     const ar=answerRow('方案二利润是多少？（奶片2000、酸奶1200）',(val,fb)=>{
       if(near(numOf(val),D.p2)){compare();}
       else fb.innerHTML='<span style="color:var(--red);font-weight:800">不对，按各自吨数乘利润再相加。</span>';
     });
     setSlot(ar.root);cleanups.push(ar.destroy);
   }
   function compare(){
     const tb=thinkBox(`${D.p1} 和 ${D.p2}，选哪个方案？`,[
       {label:`方案二，多赚 ${D.p2-D.p1}`,correct:true},
       {label:'方案一',hint:'比一比两个利润数字谁大。'},
       {label:'一样多',hint:'两个数相差多少？'}
     ]);
     tb.onPass=()=>{
       showReveal('2',`方案二 ${D.p2} − 方案一 ${D.p1} = ${D.p2-D.p1}`,
         '代回：两笔利润都按吨数和单位利润复算，方案二更高。');
       markDone();
       const b=el('button','btn go');b.type='button';b.textContent='再玩一次';
       b.onclick=()=>{resetReveals();t=D.start;rng.value=t;draw();prepMove();};
       setSlot(b);cleanups.push(()=>b.onclick=null);
     };
     setSlot(tb.root);cleanups.push(tb.destroy);
   }
   rng.oninput=()=>{t=+rng.value;resetReveals();draw();prepMove();};
   const rw=el('div','range-wrap');rw.append(cap,rng);
   wrap.append(rw,fig,slot);stage.appendChild(wrap);draw();prepMove();
   return{destroy(){cleanups.forEach(f=>{try{f();}catch{}});rng.oninput=null;}};
 }
}
};

applyHash();
</script>
